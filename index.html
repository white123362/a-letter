var BusinessState = {
    // 玩家拥有的店铺
    shops: [],
    // 当前选中的店铺
    currentShop: null,
    // 商业等级
    businessLevel: 1,
    // 总利润
    totalProfit: 0,
    // 员工列表
    employees: [],
    // 竞争信息
    competition: {
        active: false,
        rival: null,
        strength: 0,
        result: null
    },

    // 初始化
    init: function() {
        this.shops = [];
        this.employees = [];
        this.totalProfit = 0;
        this.businessLevel = 1;

        // 从存档恢复
        if (G.player && G.player.businessData) {
            this.shops = G.player.businessData.shops || [];
            this.employees = G.player.businessData.employees || [];
            this.totalProfit = G.player.businessData.totalProfit || 0;
            this.businessLevel = G.player.businessData.businessLevel || 1;
        }
    },

    // 保存数据
    save: function() {
        if (!G.player) return;
        G.player.businessData = {
            shops: this.shops,
            employees: this.employees,
            totalProfit: this.totalProfit,
            businessLevel: this.businessLevel
        };
    },

    // 检查是否可以开店
    canOpenShop: function(shopType) {
        var typeData = ShopData.types[shopType];
        if (!typeData) return false;
        if (!G.player) return false;
        if (G.player.gold < typeData.cost) return false;
        // 检查是否已经开过同类型店
        var existing = this.shops.find(function(s) { return s.type === shopType; });
        if (existing) return false;
        return true;
    },

    // 开店
    openShop: function(shopType) {
        if (!this.canOpenShop(shopType)) {
            showNotification('⚠️ 无法开店');
            return false;
        }

        var typeData = ShopData.types[shopType];
        if (!typeData) return false;

        // 扣除金币
        G.player.gold -= typeData.cost;

        // 创建店铺
        var shop = {
            id: 'shop_' + Date.now(),
            type: shopType,
            name: typeData.name,
            icon: typeData.icon,
            level: 1,
            profit: typeData.baseProfit,
            employees: typeData.employees,
            maxEmployees: typeData.maxEmployees,
            strategy: 'balanced',
            totalEarned: 0,
            daysOpen: 0,
            isActive: true
        };

        this.shops.push(shop);
        this.save();
        updateHUD();
        showNotification('🏪 成功开设 ' + typeData.name + '！');
        return true;
    },

    // 获取店铺利润
    calculateProfit: function(shop) {
        var typeData = ShopData.types[shop.type];
        if (!typeData) return 0;

        // 基础利润
        var profit = typeData.baseProfit * shop.level;

        // 策略加成
        var strategy = ShopData.strategies.find(function(s) { return s.id === shop.strategy; });
        if (strategy) {
            profit = profit * strategy.price * strategy.promotion * (1 + shop.employees * 0.05);
        }

        // 员工数量影响
        profit = profit * (1 + shop.employees * 0.08);

        // 商业等级加成
        profit = profit * (1 + (this.businessLevel - 1) * 0.05);

        // 随机波动（-20% ~ +30%）
        var fluctuation = 0.8 + Math.random() * 0.5;
        profit = Math.round(profit * fluctuation);

        return Math.max(1, profit);
    },

    // 月利润结算
    settleMonthly: function() {
        var total = 0;
        var that = this;

        this.shops.forEach(function(shop) {
            if (!shop.isActive) return;
            var profit = that.calculateProfit(shop);
            shop.totalEarned += profit;
            shop.daysOpen += 30;
            total += profit;
        });

        // 扣除员工工资
        var wage = this.employees.length * 5;

        // 商业竞争影响
        if (this.competition.active) {
            var competitionLoss = Math.round(total * (this.competition.strength / 100));
            total = Math.max(0, total - competitionLoss);
        }

        total = Math.max(0, total - wage);
        this.totalProfit += total;

        if (G.player) {
            G.player.gold += total;
            // 增加声望
            if (total > 50) {
                G.player.fame += Math.round(total / 20);
            }
        }

        this.save();
        updateHUD();

        // 显示结算通知
        if (total > 0) {
            showNotification('💰 本月店铺利润：' + total + ' 金币' + (wage > 0 ? '（工资 ' + wage + '）' : ''));
        } else {
            showNotification('📉 本月店铺亏损...');
        }

        // 检查商业竞争
        this.checkCompetition();

        return total;
    },

    // 商业竞争
    checkCompetition: function() {
        if (this.shops.length === 0) return;

        // 10%概率触发竞争
        if (Math.random() > 0.1) return;
        if (this.competition.active) return;

        var rivals = ['王家布庄', '李氏酒楼', '张记茶馆', '赵家药铺'];
        var rival = pickOne(rivals);

        this.competition.active = true;
        this.competition.rival = rival;
        this.competition.strength = 20 + Math.random() * 30;

        showNotification('⚔️ 商业竞争！' + rival + ' 发起了挑战！');
        this.handleCompetition();
    },

    // 处理竞争
    handleCompetition: function() {
        var that = this;
        var strength = this.competition.strength;

        var html = `
            <div style="text-align:center;padding:8px 0;">
                <div style="font-size:40px;">⚔️</div>
                <div style="font-size:18px;color:#f5c842;margin:6px 0;">${that.competition.rival} 向你发起商业竞争！</div>
                <div style="color:#886a7a;font-size:13px;line-height:1.8;">
                    对手实力：${Math.round(strength)}<br>
                    你的店铺等级：${that.businessLevel}
                </div>
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button onclick="BusinessSystem.resolveCompetition(true);closeModal();" style="flex:1;padding:10px;border:1px solid #2a5a6a;border-radius:12px;background:#1a2a3a;color:#4fc3f7;font-size:14px;cursor:pointer;font-family:inherit;">💪 应战</button>
                    <button onclick="BusinessSystem.resolveCompetition(false);closeModal();" style="flex:1;padding:10px;border:1px solid #6a2a2a;border-radius:12px;background:#2a1a1a;color:#ff6b6b;font-size:14px;cursor:pointer;font-family:inherit;">🏳️ 退让</button>
                </div>
            </div>
        `;

        showModal('⚔️ 商业竞争', html, '', false);
    },

    // 解决竞争
    resolveCompetition: function(doFight) {
        this.competition.active = false;

        if (!doFight) {
            // 退让，损失部分利润
            var loss = Math.round(this.totalProfit * 0.1);
            this.totalProfit = Math.max(0, this.totalProfit - loss);
            if (G.player) {
                G.player.gold = Math.max(0, G.player.gold - loss);
            }
            showNotification('🏳️ 你选择了退让，损失 ' + loss + ' 金币');
            updateHUD();
            return;
        }

        // 应战：比较实力
        var playerPower = this.businessLevel * 10 + this.shops.length * 5 + this.employees.length * 2;
        var rivalPower = this.competition.strength;

        if (playerPower >= rivalPower) {
            // 胜利
            var reward = Math.round(rivalPower * 0.5);
            this.totalProfit += reward;
            if (G.player) {
                G.player.gold += reward;
                G.player.fame += 5;
            }
            showNotification('🎉 商业竞争胜利！获得 ' + reward + ' 金币！');
            if (Math.random() < 0.2) {
                this.businessLevel++;
                showNotification('📈 商业等级提升！当前等级 ' + this.businessLevel);
            }
        } else {
            // 失败
            var penalty = Math.round(rivalPower * 0.3);
            this.totalProfit = Math.max(0, this.totalProfit - penalty);
            if (G.player) {
                G.player.gold = Math.max(0, G.player.gold - penalty);
            }
            showNotification('💔 商业竞争失败，损失 ' + penalty + ' 金币');
        }

        this.save();
        updateHUD();
    },

    // 雇佣员工
    hireEmployee: function() {
        if (this.employees.length >= 10) {
            showNotification('⚠️ 员工已满');
            return;
        }

        var cost = 30 + this.employees.length * 10;
        if (!G.player || G.player.gold < cost) {
            showNotification('⚠️ 金币不足，需要 ' + cost + ' 金币');
            return;
        }

        G.player.gold -= cost;
        var names = ['阿福', '阿寿', '阿喜', '阿财', '阿旺', '小六', '大壮', '秀儿', '婉儿', '青梅'];
        var name = pickOne(names);
        var skills = ['销售', '管理', '制作', '服务', '宣传'];
        var skill = pickOne(skills);

        this.employees.push({
            id: 'emp_' + Date.now(),
            name: name,
            skill: skill,
            level: 1,
            salary: 5 + Math.floor(Math.random() * 5)
        });

        this.save();
        updateHUD();
        showNotification('👤 雇佣了员工 ' + name + '（' + skill + '）');
    },

    // 开除员工
    fireEmployee: function(index) {
        if (index < 0 || index >= this.employees.length) return;
        var name = this.employees[index].name;
        this.employees.splice(index, 1);
        this.save();
        showNotification('👋 解雇了 ' + name);
    }
};

var CultivationState = {
    // 玩家修仙数据
    player: {
        realm: 0, // 境界等级 0-7
        realmName: '凡人',
        exp: 0,
        expToNext: 100,
        spiritualRoot: null, // 灵根
        technique: 'taixu', // 当前功法
        techniqueLevel: 1,
        spells: [],
        tribulationCount: 0, // 渡劫次数
        hasAscended: false // 是否飞升
    },

    // 初始化
    init: function() {
        if (!G.player) return;

        // 从玩家数据恢复
        if (G.player.cultivation) {
            this.player = G.player.cultivation;
        }

        // 同步境界名称
        var realmData = RealmData.realms[this.player.realm] || RealmData.realms[0];
        this.player.realmName = realmData.name;
        G.player.realmName = realmData.name;
        G.player.realm = this.player.realm;

        // 如果没有灵根，随机生成一个
        if (!this.player.spiritualRoot) {
            var roots = RealmData.spiritualRoots;
            this.player.spiritualRoot = pickOne(roots).id;
        }

        updateHUD();
    },

    // 保存
    save: function() {
        if (!G.player) return;
        G.player.cultivation = this.player;
        G.player.realmName = this.player.realmName;
        G.player.realm = this.player.realm;
    },

    // 获取当前境界数据
    getRealmData: function() {
        return RealmData.realms[this.player.realm] || RealmData.realms[0];
    },

    // 获取灵根数据
    getRootData: function() {
        return RealmData.spiritualRoots.find(function(r) { return r.id === this.player.spiritualRoot; }) || RealmData.spiritualRoots[0];
    },

    // 获取功法数据
    getTechniqueData: function() {
        return RealmData.techniques.find(function(t) { return t.id === this.player.technique; }) || RealmData.techniques[0];
    },

    // 修炼（增加经验）
    cultivate: function() {
        if (this.player.realm >= 7) {
            showNotification('✨ 你已飞升成仙，无需再修炼');
            return;
        }

        // 根据境界和功法计算修炼效率
        var realmBonus = 1 + this.player.realm * 0.2;
        var techBonus = 1 + (this.player.techniqueLevel - 1) * 0.1;
        var rootBonus = 1 + (this.getRootData().id === 'wood' ? 0.3 : 0);

        var gain = Math.round((5 + Math.random() * 10) * realmBonus * techBonus * rootBonus);

        // 如果当前有灵气丹，加成
        if (hasItem('item_dan')) {
            gain = Math.round(gain * 1.3);
            removeItem('item_dan', 1);
        }

        this.player.exp += gain;

        // 检查突破
        var nextRealm = RealmData.realms[this.player.realm + 1];
        if (nextRealm && this.player.exp >= nextRealm.needExp) {
            this.tryBreakthrough();
        } else {
            showNotification('🧘 修炼获得 ' + gain + ' 经验');
        }

        this.save();
        updateHUD();
    },

    // 尝试突破
    tryBreakthrough: function() {
        var current = this.player.realm;
        var next = current + 1;
        var nextData = RealmData.realms[next];

        if (next > 7) {
            showNotification('✨ 你已达飞升之境！');
            return;
        }

        // 渡劫判定
        var successRate = 0.7 - (next - 1) * 0.05;
        successRate = Math.max(0.3, successRate);

        // 功法加成
        var tech = this.getTechniqueData();
        if (tech.rarity === 'SSR') successRate += 0.1;
        if (tech.rarity === 'SR') successRate += 0.05;

        // 渡劫丹加成
        if (hasItem('item_fu')) {
            successRate += 0.15;
            removeItem('item_fu', 1);
        }

        var isSuccess = Math.random() < successRate;

        if (isSuccess) {
            this.player.realm = next;
            this.player.realmName = nextData.name;
            G.player.realmName = nextData.name;
            G.player.realm = next;

            // 属性提升
            if (G.player) {
                G.player.maxHealth += nextData.hpBonus;
                G.player.health = G.player.maxHealth;
                G.player.maxInnerPower += nextData.innerBonus;
                G.player.innerPower = G.player.maxInnerPower;
                G.player.attack += nextData.attackBonus;
                G.player.defense += nextData.defenseBonus;
            }

            // 渡劫次数+1
            this.player.tribulationCount++;

            // 解锁仙术
            RealmData.spells.forEach(function(spell) {
                if (spell.unlockRealm === next && !this.player.spells.includes(spell.id)) {
                    this.player.spells.push(spell.id);
                    showNotification('✨ 解锁仙术：' + spell.name);
                }
            }, this);

            this.save();
            updateHUD();

            // 成就检查
            if (next === 3) unlockAchievement('ach_realm');
            if (next === 7) {
                unlockAchievement('ach_immortal');
                this.player.hasAscended = true;
                showNotification('🎉 你已飞升成仙！');
            }

            showModal('🎉 突破成功！', `
                <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:48px;">✨</div>
                    <div style="font-size:24px;color:#f5c842;margin:6px 0;">突破成功！</div>
                    <div style="font-size:18px;color:#d4a0d4;">${nextData.name}</div>
                    <div style="color:#886a7a;font-size:13px;margin-top:4px;">${nextData.desc}</div>
                    <div style="color:#4fc3f7;font-size:13px;margin-top:6px;">⚔️ 攻击+${nextData.attackBonus} · 🛡️ 防御+${nextData.defenseBonus}</div>
                </div>
            `, '继续', false);

        } else {
            // 突破失败，损失部分经验
            this.player.exp = Math.max(0, this.player.exp - Math.round(this.player.exp * 0.3));
            this.save();
            updateHUD();

            showModal('💔 突破失败', `
                <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:48px;">💔</div>
                    <div style="font-size:20px;color:#ff6b6b;margin:6px 0;">突破失败...</div>
                    <div style="color:#886a7a;font-size:14px;">损失了部分修为，继续修炼吧</div>
                    <div style="color:#886a7a;font-size:12px;margin-top:4px;">成功率 ${Math.round(successRate*100)}%</div>
                </div>
            `, '继续', true);
        }
    },

    // 切换功法
    changeTechnique: function(techId) {
        var tech = RealmData.techniques.find(function(t) { return t.id === techId; });
        if (!tech) return;

        // 检查是否拥有（简化版：默认拥有所有）
        this.player.technique = techId;
        this.player.techniqueLevel = 1;
        this.save();
        showNotification('📜 切换功法：' + tech.name);
        updateHUD();
    },

    // 获取可用的仙术
    getAvailableSpells: function() {
        var that = this;
        return RealmData.spells.filter(function(spell) {
            return that.player.realm >= spell.unlockRealm;
        });
    }
};

            G.player.isFlying = this.isFlying;
            G.player.mount = this.currentMount;
            G.player.sword = this.currentSword;
        }
    },

    // 保存
    save: function() {
        if (!G.player) return;
        G.player.mountData = {
            ownedMounts: this.ownedMounts,
            currentMount: this.currentMount,
            isRiding: this.isRiding,
            ownedSwords: this.ownedSwords,
            currentSword: this.currentSword,
            isFlying: this.isFlying
        };
        // 同步
        G.player.isRiding = this.isRiding;
        G.player.isFlying = this.isFlying;
        G.player.mount = this.currentMount;
        G.player.sword = this.currentSword;
    },

    // 骑乘灵宠
    ride: function(mountId) {
        if (!mountId) return false;

        // 检查是否拥有
        if (!this.ownedMounts.includes(mountId)) {
            showNotification('⚠️ 你还没有这只灵宠');
            return false;
        }

        var mount = MountData.mounts.find(function(m) { return m.id === mountId; });
        if (!mount) return false;

        if (this.isRiding && this.currentMount === mountId) {
            // 如果已经在骑乘，则下来
            this.dismount();
            return true;
        }

        this.currentMount = mountId;
        this.isRiding = true;
        G.player.isRiding = true;
        G.player.mount = mountId;
        this.save();
        updateHUD();

        showNotification('🐉 骑上 ' + mount.name + '！速度提升！');
        return true;
    },

    // 下马
    dismount: function() {
        this.isRiding = false;
        G.player.isRiding = false;
        this.save();
        updateHUD();
        showNotification('🚶 已下马');
    },

    // 御剑
    fly: function(swordId) {
        if (!swordId) {
            // 如果没有指定，使用当前飞剑
            swordId = this.currentSword || 'iron';
        }

        if (!this.ownedSwords.includes(swordId)) {
            showNotification('⚠️ 你还没有这把飞剑');
            return false;
        }

        var sword = MountData.swords.find(function(s) { return s.id === swordId; });
        if (!sword) return false;

        // 检查境界
        var realm = CultivationState.player.realm;
        if (realm < 2) {
            showNotification('⚠️ 需要金丹期才能御剑飞行');
            return false;
        }

        if (this.isFlying && this.currentSword === swordId) {
            // 如果已经在飞，则降落
            this.land();
            return true;
        }

        this.currentSword = swordId;
        this.isFlying = true;
        G.player.isFlying = true;
        G.player.sword = swordId;
        this.save();
        updateHUD();

        showNotification('🗡️ 御剑飞行！乘 ' + sword.name + ' 翱翔天际！');
        unlockAchievement('ach_fly');
        return true;
    },

    // 降落
    land: function() {
        this.isFlying = false;
        G.player.isFlying = false;
        this.save();
        updateHUD();
        showNotification('🦅 已降落');
    },

    // 获取灵宠数据
    getMount: function(id) {
        return MountData.mounts.find(function(m) { return m.id === id; });
    },

    // 获取飞剑数据
    getSword: function(id) {
        return MountData.swords.find(function(s) { return s.id === id; });
    },

    // 检查是否可以获取灵宠
    canGetMount: function(mountId) {
        var mount = this.getMount(mountId);
        if (!mount) return false;
        if (this.ownedMounts.includes(mountId)) return false;
        if (!G.player) return false;

        // 检查条件
        if (mountId === 'phoenix' && CultivationState.player.realm < 7) {
            showNotification('⚠️ 需要飞升后才能获得凤凰');
            return false;
        }

        if (mountId === 'qilin' && G.player.fame < 150) {
            showNotification('⚠️ 需要150声望');
            return false;
        }

        if (G.player.gold < mount.cost) {
            showNotification('⚠️ 金币不足，需要 ' + mount.cost);
            return false;
        }

        return true;
    },

    // 获取灵宠
    getMountPermanent: function(mountId) {
        if (!this.canGetMount(mountId)) return false;

        var mount = this.getMount(mountId);
        if (!mount) return false;

        G.player.gold -= mount.cost;
        this.ownedMounts.push(mountId);
        this.save();
        updateHUD();
        showNotification('🎉 获得灵宠：' + mount.name + '！');
        return true;
    },

    // 检查是否可以获取飞剑
    canGetSword: function(swordId) {
        var sword = this.getSword(swordId);
        if (!sword) return false;
        if (this.ownedSwords.includes(swordId)) return false;
        if (!G.player) return false;

        if (swordId === 'liuguang' && CultivationState.player.realm < 4) {
            showNotification('⚠️ 需要化神期才能获得流光剑');
            return false;
        }

        if (G.player.gold < sword.cost) {
            showNotification('⚠️ 金币不足，需要 ' + sword.cost);
            return false;
        }

        return true;
    },

    // 获取飞剑
    getSwordPermanent: function(swordId) {
        if (!this.canGetSword(swordId)) return false;

        var sword = this.getSword(swordId);
        if (!sword) return false;

        G.player.gold -= sword.cost;
        this.ownedSwords.push(swordId);
        if (this.ownedSwords.length === 1) {
            this.currentSword = swordId;
        }
        this.save();
        updateHUD();
        showNotification('🎉 获得飞剑：' + sword.name + '！');
        return true;
    }
};

function openMountPanel() {
    var html = `
        <div style="padding:4px 0;">
            <div style="display:flex;justify-content:space-between;border-bottom:1px solid #1a1a2a;padding-bottom:8px;margin-bottom:8px;">
                <span style="color:#7ec8a3;">🐉 灵宠 · 飞剑</span>
                <span style="color:#886a7a;font-size:12px;">${MountState.isRiding ? '🐉 骑乘中' : MountState.isFlying ? '🗡️ 御剑中' : '🚶 步行中'}</span>
            </div>
    `;

    // 灵宠列表
    html += `<div style="margin-bottom:6px;"><span style="color:#886a7a;font-size:13px;">🐉 灵宠</span></div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">`;

    MountData.mounts.forEach(function(mount) {
        var has = MountState.ownedMounts.includes(mount.id);
        var isActive = MountState.currentMount === mount.id && MountState.isRiding;

        html += `
            <div style="padding:6px;border:1px solid ${isActive ? '#7ec8a3' : has ? '#1a1a2a' : '#0a0a0a'};border-radius:8px;background:${isActive ? '#0a1a0a' : has ? '#1a1212' : '#0a0a0a'};">
                <div style="font-size:20px;text-align:center;">${mount.icon}</div>
                <div style="font-size:12px;text-align:center;color:${isActive ? '#7ec8a3' : '#ddd'};">${mount.name}</div>
                <div style="font-size:9px;color:#886a7a;text-align:center;">${has ? (isActive ? '✅ 骑乘中' : '拥有') : '🔒'}</div>
                ${!has ? `<button onclick="MountState.getMountPermanent('${mount.id}');closeModal();setTimeout(function(){openMountPanel();},300);" style="width:100%;padding:2px;border:1px solid #5a5a2a;border-radius:6px;background:#1a1a0a;color:#f5c842;font-size:9px;cursor:pointer;font-family:inherit;">🪙${mount.cost}</button>` : 
                `<button onclick="MountState.ride('${mount.id}');closeModal();setTimeout(function(){openMountPanel();},300);" style="width:100%;padding:2px;border:1px solid ${isActive ? '#6a2a2a' : '#2a5a6a'};border-radius:6px;background:${isActive ? '#1a0a0a' : '#1a2a3a'};color:${isActive ? '#ff6b6b' : '#4fc3f7'};font-size:9px;cursor:pointer;font-family:inherit;">${isActive ? '下马' : '骑乘'}</button>`}
            </div>
        `;
    });

    html += `</div>`;

    // 飞剑列表
    html += `<div style="margin-top:10px;border-top:1px solid #1a1a2a;padding-top:8px;"><span style="color:#886a7a;font-size:13px;">🗡️ 飞剑</span></div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">`;

    MountData.swords.forEach(function(sword) {
        var has = MountState.ownedSwords.includes(sword.id);
        var isActive = MountState.currentSword === sword.id && MountState.isFlying;

        html += `
            <div style="padding:6px;border:1px solid ${isActive ? '#a8a8e8' : has ? '#1a1a2a' : '#0a0a0a'};border-radius:8px;background:${isActive ? '#0a0a1a' : has ? '#1a1212' : '#0a0a0a'};">
                <div style="font-size:20px;text-align:center;">${sword.icon}</div>
                <div style="font-size:12px;text-align:center;color:${isActive ? '#a8a8e8' : '#ddd'};">${sword.name}</div>
                <div style="font-size:9px;color:#886a7a;text-align:center;">${has ? (isActive ? '✅ 御剑中' : '拥有') : '🔒'}</div>
                ${!has ? `<button onclick="MountState.getSwordPermanent('${sword.id}');closeModal();setTimeout(function(){openMountPanel();},300);" style="width:100%;padding:2px;border:1px solid #5a5a2a;border-radius:6px;background:#1a1a0a;color:#f5c842;font-size:9px;cursor:pointer;font-family:inherit;">🪙${sword.cost}</button>` : 
                `<button onclick="MountState.fly('${sword.id}');closeModal();setTimeout(function(){openMountPanel();},300);" style="width:100%;padding:2px;border:1px solid ${isActive ? '#6a2a2a' : '#2a5a6a'};border-radius:6px;background:${isActive ? '#1a0a0a' : '#1a2a3a'};color:${isActive ? '#ff6b6b' : '#4fc3f7'};font-size:9px;cursor:pointer;font-family:inherit;">${isActive ? '降落' : '御剑'}</button>`}
            </div>
        `;
    });

    html += `</div>`;

    // 快捷操作
    html += `
        <div style="margin-top:8px;border-top:1px solid #1a1a2a;padding-top:8px;display:flex;gap:6px;">
            ${MountState.isRiding ? `<button onclick="MountState.dismount();closeModal();" style="flex:1;padding:6px;border:1px solid #6a2a2a;border-radius:8px;background:#1a0a0a;color:#ff6b6b;font-size:12px;cursor:pointer;font-family:inherit;">🐉 下马</button>` : ''}
            ${MountState.isFlying ? `<button onclick="MountState.land();closeModal();" style="flex:1;padding:6px;border:1px solid #6a2a2a;border-radius:8px;background:#1a0a0a;color:#ff6b6b;font-size:12px;cursor:pointer;font-family:inherit;">🗡️ 降落</button>` : ''}
            ${(!MountState.isRiding && !MountState.isFlying) ? '<span style="color:#886a7a;font-size:12px;padding:6px;">🚶 步行中</span>' : ''}
        </div>
    `;

    html += `</div>`;

    showModal('🐉 灵宠 · 飞剑', html, '关闭', false);
}

        // 切换到监狱场景
        SceneManager.switchTo('scene_prison');
        updateHUD();
    },

    // 服刑一天
    serveDay: function() {
        if (!this.isInPrison) return;
        this.daysRemaining--;
        if (this.daysRemaining <= 0) {
            this.release();
        } else {
            showNotification('⛓️ 剩余刑期：' + this.daysRemaining + ' 天');
            G.player.prisonDays = this.daysRemaining;
            updateHUD();
        }
    },

    // 释放
    release: function() {
        this.isInPrison = false;
        this.daysRemaining = 0;
        G.player.isInPrison = false;
        G.player.prisonDays = 0;
        showNotification('🎉 刑满释放！你重获自由！');
        SceneManager.switchTo('scene_changan');
        updateHUD();
    },

    // 越狱（贿赂/挖地道）
    escape: function(method) {
        if (!this.isInPrison) return;

        if (method === 'bribe') {
            // 贿赂狱卒
            if (!G.player || G.player.gold < 50) {
                showNotification('⚠️ 需要50金币贿赂狱卒');
                return false;

            G.player.gold -= 50;
            var success = Math.random() < 0.6;
            if (success) {
                showNotification('💰 你贿赂了狱卒，成功越狱！');
                this.release();
                return true;
            } else {
                showNotification('❌ 贿赂失败，狱卒没收了你的钱');
                this.daysRemaining += 1;
                return false;
            }
        } else if (method === 'dig') {

            var success2 = Math.random() < 0.3;
            if (success2) {
                showNotification('🔨 你挖通了地道，成功越狱！');

                return true;

                this.daysRemaining += 2;
                return false;
            }
        }
        updateHUD();
    },

    prisonDaily: function() {

var StorySystem = {
    progress: 0,
    chosenPath: null,
    unlockedEndings: [],
    collectedMemories: [],

    // 初始化
    init: function() {
        if (G.player) {
            this.progress = G.storyProgress || 0;
            this.collectedMemories = G.collectedMemories || [];
            this.unlockedEndings = G.unlockedEndings || [];
        }
    },

    // 触发剧情
    triggerAct: function(actId) {
        var act = StoryData.acts.find(function(a) { return a.id === actId; });
        if (!act) return;
        if (act.trigger) act.trigger();
        this.progress = StoryData.acts.indexOf(act) + 1;
        if (G.player) G.storyProgress = this.progress;
        this.save();
    },

    // 选择路径
    choosePath: function(path) {
        this.chosenPath = path;
        if (G.player) G.storyChoice = path;
        this.save();
        if (path === 'revenge') {
            showModal('⚔️ 你选择了复仇', `
                <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:40px;">⚔️</div>
                    <div style="font-size:18px;color:#ff6b6b;margin:6px 0;">你握紧了手中的剑</div>
                    <div style="color:#886a7a;font-size:14px;">有些债，需要用血来还</div>
                </div>
            `, '继续', true);
        } else {
            showModal('🕊️ 你选择了原谅', `
                <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:40px;">🕊️</div>
                    <div style="font-size:18px;color:#4fc3f7;margin:6px 0;">你放下了手中的剑</div>
                    <div style="color:#886a7a;font-size:14px;">有些事，比仇恨更重要</div>
                </div>
            `, '继续', false);
        }
        // 继续到第5幕
        setTimeout(function() {
            StorySystem.triggerAct('act5');
        }, 1000);
    },

    // 触发结局
    triggerEnding: function() {
        var endingId = this.determineEnding();
        var ending = StoryData.endings.find(function(e) { return e.id === endingId; });
        if (!ending) return;

        this.unlockedEndings.push(endingId);
        if (G.player) {
            if (!G.player.unlockedEndings) G.player.unlockedEndings = [];
            G.player.unlockedEndings.push(endingId);
        }

        showModal('🏁 结局：' + ending.title, `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:48px;">${ending.title.split(' ')[0]}</div>
                <div style="font-size:20px;color:#f5c842;margin:6px 0;">${ending.title}</div>
                <div style="color:#ddd;font-size:14px;line-height:1.8;padding:8px;">${ending.desc}</div>
                <div style="color:#886a7a;font-size:12px;margin-top:8px;">💡 结局已解锁，可在图鉴中查看</div>
            </div>
        `, '再见', false);

        this.save();
    },

    // 决定结局
    determineEnding: function() {
        var realm = CultivationState.player.realm;
        var rank = ExamState.player.rank;
        var fame = G.player ? G.player.fame : 0;
        var path = this.chosenPath;

        // 真结局条件
        if (this.collectedMemories.length >= 10 && realm >= 3) {
            return 'ending_true';
        }
        // 飞升结局
        if (realm >= 7) return 'ending_immortal';
        // 帝王结局
        if (rank >= 18) return 'ending_emperor';
        // 魔尊结局
        if (path === 'revenge' && G.player && G.player.sin > 50) return 'ending_demon';
        // 双生结局
        if (this.collectedMemories.includes('twin')) return 'ending_twin';
        // 妖狐结局
        if (this.collectedMemories.includes('fox')) return 'ending_fox';
        // 转世结局
        if (G.player && G.player.karma > 80) return 'ending_past';
        // 死亡结局
        if (G.player && G.player.health < 20) return 'ending_death';
        // 光明/黑暗/平衡
        if (path === 'revenge') return 'ending_dark';
        if (path === 'forgive') return 'ending_good';
        return 'ending_balance';
    },

    // 收集记忆碎片
    collectMemory: function(id) {
        if (this.collectedMemories.includes(id)) return;
        this.collectedMemories.push(id);
        if (G.player) {
            if (!G.player.collectedMemories) G.player.collectedMemories = [];
            G.player.collectedMemories.push(id);
        }
        showNotification('🧩 收集到记忆碎片：' + id);
        if (this.collectedMemories.length >= 10) {
            showNotification('🌟 集齐所有记忆碎片！');
        }
        this.save();
    },

    // 保存
    save: function() {
        if (G.player) {
            G.player.storyProgress = this.progress;
            G.player.storyChoice = this.chosenPath;
            G.player.unlockedEndings = this.unlockedEndings;
            G.player.collectedMemories = this.collectedMemories;
        }
    },

    // 回忆独白
    monologue: function(charId) {
        var monologues = {
            'shenci': '我这一生，只拔过三次剑。一次为家国，一次为兄弟，还有一次……为了她。',
            'suwan': '我弹了一首曲子，他再也没有回来。',
            'guchangye': '我在战场受了伤，却不及心里那道疤。',
            'liuruyan': '我送走了一个人，等了一辈子。',
            'luyunzhao': '我写了一封情书，没敢送出去。',
            'jiangyuebai': '我救过很多人，唯独救不了你。'
        };
        var text = monologues[charId] || '……';
        showModal('💭 独白', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:36px;">💭</div>
                <div style="color:#ddd;font-size:16px;line-height:1.8;padding:8px;font-style:italic;">"${text}"</div>
            </div>
        `, '继续', false);
    },

    // 番外篇
    extraChapter: function() {
        showModal('📖 番外篇 · 雪夜话别', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:48px;">❄️</div>
                <div style="font-size:20px;color:#f5c842;margin:6px 0;">雪夜话别</div>
                <div style="color:#ddd;font-size:14px;line-height:1.8;text-align:left;padding:8px;">
                    雪夜山庄的最后一夜。<br><br>
                    你们围坐在火炉旁，谁都没有说话。<br>
                    火光照亮了每一张脸。<br><br>
                    你知道，过了今晚，有些人就再也见不到了。<br><br>
                    <span style="color:#c45a6a;">—— "保重。"</span>
                    <span style="color:#886a7a;">—— "你也是。"</span>
                </div>
            </div>
        `, '谢谢', false);
    }
};

var OnlineState = {

    isConnected: false,

    chatLog: [],

    team: [],

    // 初始化
    init: function() {
        // 检查是否已有PeerJS库
        if (typeof Peer === 'undefined') {
            console.log('⚠️ PeerJS 未加载，联机功能不可用');
            return;

        console.log('✅ 联机系统就绪');

    // 创建房间（成为房主）
    createRoom: function() {
        if (this.isConnected) {
            showNotification('⚠️ 已连接，请先断开');
            return;
        }

        var self = this;
        this.peer = new Peer();

        this.peer.on('open', function(id) {
            self.myId = id;
            self.roomId = id;
            self.isHost = true;
            self.isConnected = true;
            self.players.push({ id: id, name: G.player ? G.player.name : '玩家', isHost: true });

            showModal('🌐 房间已创建', `
                <div style="text-align:center;padding:12px 0;">
                    <div style="font-size:48px;">🌐</div>
                    <div style="font-size:20px;color:#4fc3f7;margin:6px 0;">房间创建成功！</div>

                    <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;">
                        <button onclick="navigator.clipboard.writeText('${id}')" style="padding:6px 16px;border:1px solid #2a5a6a;border-radius:8px;background:#1a2a3a;color:#4fc3f7;cursor:pointer;font-family:inherit;">📋 复制房间号</button>
                    </div>
                </div>
            `, '开始游戏', false);

            // 监听连接
            self.peer.on('connection', function(conn) {
                self.handleConnection(conn);
            });
        });

        this.peer.on('error', function(err) {
            showNotification('❌ 创建房间失败：' + err.message);
        });
    },

    // 加入房间
    joinRoom: function(roomId) {
        if (this.isConnected) {
            showNotification('⚠️ 已连接，请先断开');
            return;
        }

        if (!roomId || roomId.trim() === '') {
            showNotification('⚠️ 请输入房间号');
            return;
        }

        var self = this;
        this.peer = new Peer();

        this.peer.on('open', function(id) {
            self.myId = id;
            self.roomId = roomId.trim();
            self.isHost = false;
            self.isConnected = true;

            var conn = self.peer.connect(roomId.trim());
            conn.on('open', function() {
                self.connections[roomId] = conn;
                self.players.push({ id: id, name: G.player ? G.player.name : '玩家', isHost: false });
                showNotification('✅ 已加入房间：' + roomId);

                // 发送加入消息
                conn.send({
                    type: 'join',
                    player: { id: id, name: G.player ? G.player.name : '玩家' }
                });
            });

            conn.on('data', function(data) {
                self.handleData(data);
            });

            conn.on('close', function() {
                showNotification('❌ 与房主断开连接');
                self.disconnect();
            });
        });

        this.peer.on('error', function(err) {
            showNotification('❌ 加入失败：' + err.message);
        });
    },

    // 处理连接
    handleConnection: function(conn) {
        var self = this;
        var playerId = conn.peer;

        conn.on('open', function() {
            self.connections[playerId] = conn;
            showNotification('👤 玩家 ' + playerId + ' 加入房间');
        });

        conn.on('data', function(data) {
            self.handleData(data);
        });

        conn.on('close', function() {
            delete self.connections[playerId];
            self.players = self.players.filter(function(p) { return p.id !== playerId; });
            showNotification('👤 玩家 ' + playerId + ' 离开房间');
            updateHUD();
        });
    },

    // 处理数据
    handleData: function(data) {
        var self = this;

        switch (data.type) {
            case 'join':
                // 新玩家加入
                if (!this.players.find(function(p) { return p.id === data.player.id; })) {
                    this.players.push(data.player);
                    showNotification('👤 ' + data.player.name + ' 加入了游戏');
                    updateHUD();
                    // 广播给所有玩家
                    this.broadcast({ type: 'player_list', players: this.players });
                }
                break;

            case 'chat':
                // 聊天消息
                this.addChatMessage(data.name, data.message);
                this.broadcast({ type: 'chat', name: data.name, message: data.message });
                break;

            case 'player_list':
                this.players = data.players;
                updateHUD();
                break;

            case 'sync':
                // 同步游戏状态
                if (data.state) {
                    // 更新本地状态（选择性同步）
                    if (data.state.location) G.player.location = data.state.location;
                    if (data.state.position) {
                        WalkAnimation.x = data.state.position.x;
                        WalkAnimation.y = data.state.position.y;
                    }
                }
                break;

            case 'trade_request':
                // 交易请求
                this.handleTradeRequest(data);
                break;

            case 'trade_response':
                this.handleTradeResponse(data);
                break;

            case 'team_invite':
                this.handleTeamInvite(data);
                break;

            default:
                console.log('未知数据:', data);
        }
    },

    // 广播消息
    broadcast: function(data) {
        for (var id in this.connections) {
            try {
                this.connections[id].send(data);
            } catch (e) {}
        }
    },

    // 发送聊天
    sendChat: function(message) {
        if (!this.isConnected) {
            showNotification('⚠️ 未连接到房间');
            return;
        }
        var name = G.player ? G.player.name : '玩家';
        this.addChatMessage(name, message);
        this.broadcast({ type: 'chat', name: name, message: message });
    },

    // 添加聊天消息
    addChatMessage: function(name, message) {
        this.chatLog.push({ name: name, message: message, time: new Date().toLocaleTimeString() });
        // 显示在聊天区域
        var chatArea = document.getElementById('chatArea');
        if (chatArea) {
            var div = document.createElement('div');
            div.className = 'chat-msg';
            div.style.cssText = 'padding:4px 8px;font-size:12px;color:#ddd;border-bottom:1px solid #1a1a2a;';
            div.innerHTML = '<span style="color:#f5c842;">' + name + '</span>：' + message;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    },

    // 同步位置
    syncPosition: function() {
        if (!this.isConnected) return;
        this.broadcast({
            type: 'sync',
            state: {
                location: G.player.location,
                position: { x: WalkAnimation.x, y: WalkAnimation.y }
            }
        });
    },

    // 交易请求
    requestTrade: function(targetId, itemId) {
        if (!this.isConnected) {
            showNotification('⚠️ 未连接到房间');
            return;
        }
        var item = G.inventory.find(function(i) { return i.id === itemId; });
        if (!item || item.count <= 0) {
            showNotification('⚠️ 你没有这件物品');
            return;
        }
        this.broadcast({
            type: 'trade_request',
            from: this.myId,
            fromName: G.player.name,
            itemId: itemId,
            itemName: item.name
        });
    },

    handleTradeRequest: function(data) {
        var self = this;
        showModal('💼 交易请求', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:36px;">💼</div>
                <div style="font-size:16px;color:#f5c842;margin:6px 0;">${data.fromName} 想与你交易</div>
                <div style="color:#ddd;font-size:14px;">物品：${data.itemName}</div>
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button onclick="OnlineState.acceptTrade('${data.from}','${data.itemId}');closeModal();" style="flex:1;padding:8px;border:1px solid #2a5a6a;border-radius:8px;background:#1a2a3a;color:#4fc3f7;cursor:pointer;font-family:inherit;">✅ 接受</button>
                    <button onclick="OnlineState.rejectTrade();closeModal();" style="flex:1;padding:8px;border:1px solid #6a2a2a;border-radius:8px;background:#2a1a1a;color:#ff6b6b;cursor:pointer;font-family:inherit;">❌ 拒绝</button>
                </div>
            </div>
        `, '', false);
    },

    acceptTrade: function(fromId, itemId) {
        // 处理交易逻辑
        var item = G.inventory.find(function(i) { return i.id === itemId; });
        if (item && item.count > 0) {
            item.count--;
            showNotification('✅ 交易成功，你获得了 ' + item.name);
            // 通知对方
            this.broadcast({
                type: 'trade_response',
                from: fromId,
                accepted: true
            });
        } else {
            showNotification('❌ 物品已不存在');
            this.broadcast({
                type: 'trade_response',
                from: fromId,
                accepted: false
            });
        }
    },

    rejectTrade: function() {
        showNotification('❌ 你拒绝了交易');
    },

    // 组队邀请
    inviteToTeam: function(playerId) {
        if (!this.isConnected) return;
        this.broadcast({
            type: 'team_invite',
            from: this.myId,
            fromName: G.player.name
        });
    },

    handleTeamInvite: function(data) {
        var self = this;
        showModal('🤝 组队邀请', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:36px;">🤝</div>
                <div style="font-size:16px;color:#f5c842;margin:6px 0;">${data.fromName} 邀请你组队</div>
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button onclick="OnlineState.acceptTeamInvite();closeModal();" style="flex:1;padding:8px;border:1px solid #2a5a6a;border-radius:8px;background:#1a2a3a;color:#4fc3f7;cursor:pointer;font-family:inherit;">✅ 接受</button>
                    <button onclick="OnlineState.rejectTeamInvite();closeModal();" style="flex:1;padding:8px;border:1px solid #6a2a2a;border-radius:8px;background:#2a1a1a;color:#ff6b6b;cursor:pointer;font-family:inherit;">❌ 拒绝</button>
                </div>
            </div>
        `, '', false);
    },

    acceptTeamInvite: function() {
        this.team.push(this.myId);
        showNotification('🤝 你已加入队伍');
    },

    rejectTeamInvite: function() {
        showNotification('❌ 你拒绝了组队邀请');
    },

    // 断开连接
    disconnect: function() {
        if (this.peer) {
            this.peer.destroy();
        }
        this.isConnected = false;
        this.isHost = false;
        this.roomId = null;
        this.connections = {};
        this.players = [];
        this.team = [];
        showNotification('🔌 已断开连接');
        updateHUD();
    },

    // 获取玩家列表显示
    getPlayerListHTML: function() {
        if (this.players.length === 0) return '暂无玩家';
        return this.players.map(function(p) {
            return p.name + (p.isHost ? ' 👑' : '');
        }).join(' · ');
    }
};

// ============================================================
//  一、完整的游戏循环
// ============================================================
var GameLoop = {
    isRunning: false,
    lastTime: 0,
    fps: 0,
    frameCount: 0,

    // 启动游戏循环
    start: function() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastTime = performance.now();
        this.loop();
    },

    // 主循环
    loop: function() {
        if (!this.isRunning) return;

        var now = performance.now();
        var delta = (now - this.lastTime) / 1000;
        this.lastTime = now;
        this.frameCount++;

        // FPS计算
        if (this.frameCount % 60 === 0) {
            this.fps = Math.round(1 / delta);
        }

        // 更新所有系统
        this.update(delta);

        // 渲染
        this.render();

        // 联机同步（每5秒一次）
        if (this.frameCount % 300 === 0 && OnlineState.isConnected) {
            OnlineState.syncPosition();
        }

        // 奇遇触发（每10秒一次）
        if (this.frameCount % 600 === 0) {
            EncounterSystem.trigger();
        }

        // 监狱日常
        if (PrisonSystem.isInPrison && this.frameCount % 1800 === 0) {
            PrisonSystem.prisonDaily();
        }

        requestAnimationFrame(this.loop.bind(this));
    },

    // 更新
    update: function(delta) {
        // 更新走路
        WalkAnimation.update();

        // 碰撞检测
        var pos = CollisionSystem.getSafePosition(WalkAnimation.x, WalkAnimation.y, 12);
        if (pos) {
            WalkAnimation.x = pos.x;
            WalkAnimation.y = pos.y;
        }

        // 场景切换时更新障碍物
        if (SceneManager.currentScene !== SceneManager.previousScene) {
            CollisionSystem.loadObstacles(SceneManager.currentScene);
            SceneManager.previousScene = SceneManager.currentScene;
            updateHUD();
        }

        // 更新天气（通过帧计数）
        if (this.frameCount % 600 === 0) {
            WeatherSystem.checkChange();
        }

        // 更新光照
        if (this.frameCount % 120 === 0) {
            LightSystem.update();
        }

        // 更新HUD（每60帧）
        if (this.frameCount % 60 === 0) {
            updateHUD();
        }

        // 成就检查（每120帧）
        if (this.frameCount % 120 === 0) {
            AchievementSystem.checkAll();
        }

        // 时间更新（每30帧）
        if (this.frameCount % 30 === 0) {
            TimeSystem.advance(1);
        }
    },

    // 渲染
    render: function() {
        var canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');

        // 设置画布尺寸
        var rect = canvas.parentElement.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        var w = Math.min(rect.width * dpr, 480 * dpr);
        var h = Math.min(rect.height * dpr, 640 * dpr);
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
        }

        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制场景背景
        var light = TimeSystem.getLightColor();
        var grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, light.ambient);
        grad.addColorStop(0.5, light.sun);
        grad.addColorStop(1, light.ambient);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制地面
        var groundY = canvas.height * 0.7;
        ctx.fillStyle = 'rgba(30,25,20,0.3)';
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        // 绘制远山
        ctx.fillStyle = 'rgba(20,15,20,0.15)';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.5);
        for (var i = 0; i <= canvas.width; i += 2) {
            var y = canvas.height * 0.5 + 30 * Math.sin(i * 0.008) + 20 * Math.sin(i * 0.015 + 1);
            ctx.lineTo(i, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();

        // 绘制障碍物
        CollisionSystem.obstacles.forEach(function(obs) {
            ctx.fillStyle = 'rgba(40,30,20,0.12)';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        });

        // 绘制玩家（带换装）
        renderPlayerWithOutfit(ctx);

        // 场景信息
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.font = '12px "STKaiti","华文楷体",serif';
        ctx.textAlign = 'center';
        var scene = SceneManager.getCurrentScene();
        if (scene) {
            ctx.fillText('📍 ' + scene.name + ' · ' + TimeSystem.getTimeDisplay() + ' · ' + WeatherSystem.getDescription(), canvas.width / 2, 22);
        }

        // 状态信息
        if (WalkAnimation.isWalking || PrisonSystem.isInPrison) {
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            var statusText = '';
            if (PrisonSystem.isInPrison) statusText = '⛓️ 服刑中（剩余' + PrisonSystem.daysRemaining + '天）';
            else if (G.player && G.player.isFlying) statusText = '🗡️ 御剑飞行中';
            else if (G.player && G.player.isRiding) statusText = '🐉 骑乘中';
            else statusText = WalkAnimation.isRunning ? '🏃 奔跑中' : '🚶 行走中';
            ctx.fillText(statusText, canvas.width / 2, canvas.height - 12);
        }

        // 联机玩家显示
        if (OnlineState.isConnected && OnlineState.players.length > 1) {
            ctx.fillStyle = 'rgba(79,195,247,0.3)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('🌐 ' + OnlineState.players.length + ' 人在线', canvas.width - 12, 40);
        }
    }
};

var AIConfig = {
    // 🔑 在这里填入你的 API Key
    apiKey: 'sk-63de969541fa4461867119dd72aba997',
    apiUrl: 'https://api.deepseek.com/v1/chat/completions',
    model: 'deepseek-chat',
    maxTokens: 200,
    temperature: 0.85,

    // 状态
    isEnabled: true,
    isReady: false,
    lastResponse: null,
    conversationHistory: {},

    // 初始化
    init: function() {
        if (this.apiKey && this.apiKey.startsWith('sk-')) {
            this.isReady = true;
            console.log('🤖 AI 系统就绪');
            showNotification('🤖 AI 已连接');
            updateAIStatus();
        } else {
            console.warn('⚠️ 请填入 DeepSeek API Key');
            showNotification('⚠️ 请填入 DeepSeek API Key');
        }
        return this.isReady;
    },

    // 调用 AI
    callAI: function(messages, callback) {
        if (!this.isEnabled || !this.isReady) {
            callback(null, 'AI 未就绪，请检查设置');
            return;
        }

        var data = {
            model: this.model,
            messages: messages,
            max_tokens: this.maxTokens,
            temperature: this.temperature
        };

        fetch(this.apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + this.apiKey
            },
            body: JSON.stringify(data)
        })
        .then(function(response) {
            if (!response.ok) {
                if (response.status === 401) throw new Error('API Key 无效，请检查');
                if (response.status === 429) throw new Error('请求太频繁，请稍后');
                if (response.status === 402) throw new Error('余额不足，请充值');
                throw new Error('网络错误');
            }
            return response.json();
        })
        .then(function(json) {
            if (json.choices && json.choices.length > 0) {
                var reply = json.choices[0].message.content.trim();
                callback(null, reply);
            } else {
                callback('AI 没有返回有效回复');
            }
        })
        .catch(function(error) {
            callback(error.message);
        });
    },

    // NPC 对话
    talkToNPC: function(npcId, playerMessage, callback) {
        if (!this.isEnabled || !this.isReady) {
            callback(null, 'AI 未就绪...');
            return;
        }

        // 查找NPC数据
        var npc = G.npcs.find(function(n) { return n.id === npcId; });
        if (!npc) {
            callback(null, '找不到这个NPC');
            return;
        }

        // 构建对话历史
        var history = this.conversationHistory[npcId] || [];
        var systemPrompt = '你是 ' + npc.name + '，' + npc.personality + '。' +
            '身份是 ' + npc.identity + '。' +
            '你正在长安城和一个玩家对话。' +
            '用中文回复，像真人对话一样自然，不要太长（30-50字）。' +
            '根据玩家说的话来回应，不要偏离角色设定。' +
            '如果有好感度，根据好感度调整语气。' +
            '好感度当前为 ' + (G.npcFavorability[npcId] || 50) + '。';

        var messages = [
            { role: 'system', content: systemPrompt }
        ];

        // 加入历史（最近5轮）
        var recentHistory = history.slice(-10);
        recentHistory.forEach(function(h) {
            messages.push({ role: 'user', content: h.user });
            messages.push({ role: 'assistant', content: h.assistant });
        });

        messages.push({ role: 'user', content: playerMessage });

        var self = this;
        this.callAI(messages, function(err, reply) {
            if (err) {
                // 错误时使用备用回复
                var fallbacks = ['嗯...你说得对。', '有道理。', '我在想事情。', '继续说吧。', '我明白了。'];
                callback(null, pickOne(fallbacks));
                return;
            }

            // 记录历史
            if (!self.conversationHistory[npcId]) {
                self.conversationHistory[npcId] = [];
            }
            self.conversationHistory[npcId].push({
                user: playerMessage,
                assistant: reply
            });

            // 限制历史长度
            if (self.conversationHistory[npcId].length > 50) {
                self.conversationHistory[npcId] = self.conversationHistory[npcId].slice(-50);
            }

            callback(null, reply);
        });
    },

    // 生成剧情
    generateStory: function(context, callback) {
        if (!this.isEnabled || !this.isReady) {
            callback(null, '剧情生成中...');
            return;
        }

        var systemPrompt = '你是一个古风剧本的编剧。' +
            '根据玩家的选择和当前场景，生成一段古风风格的剧情描述。' +
            '用中文，风格要唯美、含蓄、有画面感。' +
            '不要太长，50-80字左右。';

        var messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: '当前场景：' + context }
        ];

        this.callAI(messages, function(err, reply) {
            if (err) {
                callback(null, '夜深了，月光洒在庭院里，一切都静悄悄的。');
                return;
            }
            callback(null, reply);
        });
    },

    // 切换AI开关
    toggle: function() {
        this.isEnabled = !this.isEnabled;
        updateAIStatus();
        showNotification(this.isEnabled ? '🤖 AI 已开启' : '🤖 AI 已关闭');
        return this.isEnabled;
    },

    // 重置对话历史
    resetHistory: function(npcId) {
        if (npcId) {
            this.conversationHistory[npcId] = [];
        } else {
            this.conversationHistory = {};
        }
        showNotification('🗑️ 对话历史已清空');
    }
};

var BGMSystem = {
    isPlaying: false,
    audioContext: null,
    gainNode: null,
    oscillator: null,
    currentMelody: null,
    melodyInterval: null,
    volume: 0.3,

    // 古风音阶（宫商角徵羽）
    scale: [261.63, 293.66, 329.63, 392.00, 440.00],
    // 不同场景的旋律
    melodies: {
        '长安城': {
            notes: [0, 2, 4, 3, 2, 0, 4, 3],
            tempo: 400,
            style: '轻快'
        },
        '雪夜山庄': {
            notes: [4, 3, 2, 1, 0, 2, 3, 4],
            tempo: 600,
            style: '忧伤'
        },
        '桃花林': {
            notes: [2, 4, 3, 2, 0, 2, 4, 3],
            tempo: 350,
            style: '浪漫'
        },
        '月老庙': {
            notes: [0, 2, 3, 4, 3, 2, 0, 2],
            tempo: 500,
            style: '深情'
        },
        'default': {
            notes: [0, 2, 4, 2, 0, 2, 4, 3],
            tempo: 450,
            style: '古风'
        }
    },

    // 初始化
    init: function() {
        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.gainNode = this.audioContext.createGain();
            this.gainNode.gain.value = this.volume;
            this.gainNode.connect(this.audioContext.destination);
            console.log('🎵 BGM 系统就绪');
            return true;
        } catch (e) {
            console.warn('⚠️ BGM 初始化失败:', e);
            return false;
        }
    },

    // 播放旋律
    playMelody: function(sceneName) {
        if (!this.audioContext) {
            this.init();
            if (!this.audioContext) return;
        }

        // 停止当前播放
        this.stop();

        // 获取旋律
        var melody = this.melodies[sceneName] || this.melodies['default'];
        this.currentMelody = melody;

        this.isPlaying = true;
        var self = this;
        var noteIndex = 0;

        this.melodyInterval = setInterval(function() {
            if (!self.isPlaying) return;

            var noteIdx = melody.notes[noteIndex % melody.notes.length];
            var freq = self.scale[noteIdx % self.scale.length];
            self.playNote(freq, 0.3, melody.tempo / 1000 * 0.5);

            noteIndex++;
        }, melody.tempo);

        console.log('🎵 播放 BGM:', sceneName || '默认');
    },

    // 播放单个音符
    playNote: function(freq, duration, delay) {
        if (!this.audioContext) return;

        var osc = this.audioContext.createOscillator();
        var gain = this.audioContext.createGain();

        osc.type = 'sine';
        osc.frequency.value = freq;

        gain.gain.value = this.volume;
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + duration + 0.1);

        osc.connect(gain);
        gain.connect(this.audioContext.destination);

        osc.start();
        osc.stop(this.audioContext.currentTime + duration + 0.1);
    },

    // 播放琴声（用于特殊场景）
    playGuqin: function() {
        if (!this.audioContext) return;
        var notes = [261.63, 293.66, 329.63, 392.00, 523.25];
        var self = this;
        notes.forEach(function(freq, i) {
            setTimeout(function() {
                self.playNote(freq, 0.6, 0);
            }, i * 300);
        });
    },

    // 停止播放
    stop: function() {
        this.isPlaying = false;
        if (this.melodyInterval) {
            clearInterval(this.melodyInterval);
            this.melodyInterval = null;
        }
        this.currentMelody = null;
    },

    // 设置音量
    setVolume: function(vol) {
        this.volume = Math.max(0, Math.min(1, vol));
        if (this.gainNode) {
            this.gainNode.gain.value = this.volume;
        }
    },

    // 切换场景时更新BGM
    updateScene: function(sceneName) {
        if (this.isPlaying) {
            this.playMelody(sceneName);
        }
    }
};

var SpeechSystem = {
    isEnabled: true,
    voice: null,
    rate: 0.9,
    pitch: 1.0,

    // 初始化
    init: function() {
        if (!window.speechSynthesis) {
            console.warn('⚠️ 浏览器不支持语音合成');
            this.isEnabled = false;
            return false;
        }

        // 获取中文语音
        var voices = window.speechSynthesis.getVoices();
        this.voice = voices.find(function(v) {
            return v.lang.indexOf('zh') !== -1;
        }) || null;

        console.log('🗣️ 语音系统就绪');
        return true;
    },

    // 说话
    speak: function(text, gender) {
        if (!this.isEnabled || !window.speechSynthesis) return;

        // 取消当前语音
        window.speechSynthesis.cancel();

        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = this.rate;
        utterance.pitch = gender === '男' ? 0.6 : 1.2;
        utterance.volume = 0.8;

        if (this.voice) {
            utterance.voice = this.voice;
        }

        window.speechSynthesis.speak(utterance);
    },

    // 设置语速
    setRate: function(rate) {
        this.rate = Math.max(0.5, Math.min(1.5, rate));
    },

    // 开关
    toggle: function() {
        this.isEnabled = !this.isEnabled;
        if (!this.isEnabled) {
            window.speechSynthesis.cancel();
        }
        showNotification(this.isEnabled ? '🔊 语音已开启' : '🔇 语音已关闭');
        return this.isEnabled;
    }
};

        if (act) {
            AIConfig.generateStory(act.title + '：' + act.desc, function(err, storyText) {
                if (!err && storyText) {
                    // 显示在对话框中
                    setTimeout(function() {
                        showDialog('📖 剧情旁白', storyText);
                    }, 500);
                }
            });
        }
    }
};

// ============================================================
//  七、初始化所有系统
// ============================================================
function initAIAndBGM() {
    // 初始化AI
    AIConfig.init();

    // 初始化BGM
    BGMSystem.init();

    // 初始化语音
    SpeechSystem.init();

    // 加载语音列表
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() {
            var voices = window.speechSynthesis.getVoices();
            var zhVoice = voices.find(function(v) { return v.lang.indexOf('zh') !== -1; });
            if (zhVoice) SpeechSystem.voice = zhVoice;
        };
    }

    // 默认播放BGM
    setTimeout(function() {
        var currentScene = SceneManager.getCurrentScene();
        if (currentScene) {
            BGMSystem.playMelody(currentScene.name);
        } else {
            BGMSystem.playMelody('default');
        }
    }, 1000);

    console.log('✅ AI + BGM + 语音 全部初始化完成');
}

// ============================================================
//  八、UI控制
// ============================================================
// 在HUD添加BGM控制
document.addEventListener('DOMContentLoaded', function() {
    // 添加BGM控制按钮
    var hudRight = document.getElementById('hudRight');
    if (hudRight) {
        var bgmBtn = document.createElement('span');
        bgmBtn.className = 'item';
        bgmBtn.innerHTML = '<span class="icon">🎵</span><span class="val" id="bgmStatus" style="color:#7ec8a3;font-size:10px;cursor:pointer;">播放中</span>';
        bgmBtn.style.cursor = 'pointer';
        bgmBtn.onclick = function() {
            if (BGMSystem.isPlaying) {
                BGMSystem.stop();
                document.getElementById('bgmStatus').textContent = '已暂停';
                document.getElementById('bgmStatus').style.color = '#886a7a';
            } else {
                var scene = SceneManager.getCurrentScene();
                BGMSystem.playMelody(scene ? scene.name : 'default');
                document.getElementById('bgmStatus').textContent = '播放中';
                document.getElementById('bgmStatus').style.color = '#7ec8a3';
            }
        };
        hudRight.appendChild(bgmBtn);
    }

    // 语音控制快捷键（双击右上角切换）
    var avatar = document.getElementById('avatarIcon');
    if (avatar) {
        avatar.addEventListener('dblclick', function() {
            SpeechSystem.toggle();
        });
    }
});
