<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古风 · 相拥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1018;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'STKaiti', '华文楷体', 'KaiTi', serif;
            overflow: hidden;
            padding: 12px;
        }
        .container {
            background: #1f1520;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 0 60px rgba(180, 120, 160, 0.15);
            border: 1px solid #3a2a3a;
            max-width: 520px;
            width: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            border-radius: 12px;
            background: #0d0a10;
            box-shadow: inset 0 0 80px rgba(60, 30, 50, 0.3);
        }
        .title {
            text-align: center;
            color: #d4a0c0;
            font-size: 18px;
            letter-spacing: 6px;
            padding: 12px 0 6px 0;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(200, 150, 180, 0.2);
        }
        .sub {
            text-align: center;
            color: #8a6a7a;
            font-size: 12px;
            letter-spacing: 3px;
            padding-bottom: 8px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-row button {
            flex: 1;
            background: #2a1a2a;
            border: 1px solid #3a2a3a;
            color: #c0a0b0;
            padding: 10px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .btn-row button:hover {
            background: #3a2a3a;
            border-color: #d4a0c0;
            color: #d4a0c0;
        }
        .btn-row button:active {
            transform: scale(0.96);
        }
        .note {
            text-align: center;
            color: #5a4a4a;
            font-size: 11px;
            padding-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">🌺 与君相拥 · 不负此生</div>
    <div class="sub">— 肉片 ♥ 大小姐 —</div>
    <canvas id="canvas" width="480" height="600"></canvas>
    <div class="btn-row">
        <button id="playBtn">▶ 播放</button>
        <button id="resetBtn">🔄 重来</button>
        <button id="pauseBtn">⏸️ 暂停</button>
    </div>
    <div class="note">🌸 花瓣飘落 · 古风相拥</div>
</div>

<script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var W = 480,
        H = 600;

    // -------- 人物数据 --------
    var person = {
        // 男主（左）→ 肉片
        man: { x: 170, y: 310, targetX: 220, scale: 1, armAngle: 0 },
        // 女主（右）→ 大小姐
        woman: { x: 310, y: 310, targetX: 260, scale: 1, armAngle: 0 }
    };

    var progress = 0;
    var isPlaying = false;
    var animId = null;
    var paused = false;

    // 花瓣
    var petals = [];

    function initPetals() {
        petals = [];
        for (var i = 0; i < 35; i++) {
            petals.push({
                x: Math.random() * W,
                y: Math.random() * H - H,
                size: 4 + Math.random() * 8,
                speed: 0.6 + Math.random() * 1.2,
                wobble: Math.random() * 0.03,
                phase: Math.random() * Math.PI * 2,
                opacity: 0.5 + Math.random() * 0.5,
                color: ['#f0c8d0', '#e8b8c8', '#d8a8b8', '#f8d8d0', '#e0b0b8'][Math.floor(Math.random() * 5)]
            });
        }
    }
    initPetals();

    // -------- 绘制古风人物（带头顶名字） --------
    function drawPerson(x, y, scale, gender, armAngle, isEmbracing, name) {
        var s = scale;
        ctx.save();
        ctx.translate(x, y);

        // --- 身体（长袍/汉服）---
        ctx.shadowColor = 'rgba(200,150,180,0.08)';
        ctx.shadowBlur = 20;

        var bodyColor, robeColor, sleeveColor, beltColor, hairColor, skinColor;
        if (gender === 'man') {
            bodyColor = '#2a1a2a';
            robeColor = '#3a283a';
            sleeveColor = '#4a304a';
            beltColor = '#8a6a5a';
            hairColor = '#1a1018';
            skinColor = '#e8d0c8';
        } else {
            bodyColor = '#2a1a2a';
            robeColor = '#6a3a5a';
            sleeveColor = '#8a4a6a';
            beltColor = '#c8a080';
            hairColor = '#1a0a18';
            skinColor = '#f0d8d0';
        }

        // 长袍下摆
        ctx.beginPath();
        ctx.moveTo(-22 * s, 20 * s);
        ctx.quadraticCurveTo(-30 * s, 45 * s, -20 * s, 65 * s);
        ctx.lineTo(20 * s, 65 * s);
        ctx.quadraticCurveTo(30 * s, 45 * s, 22 * s, 20 * s);
        ctx.closePath();
        ctx.fillStyle = robeColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,50,0.4)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // 上身
        ctx.beginPath();
        ctx.moveTo(-18 * s, -8 * s);
        ctx.quadraticCurveTo(-22 * s, 8 * s, -20 * s, 20 * s);
        ctx.lineTo(20 * s, 20 * s);
        ctx.quadraticCurveTo(22 * s, 8 * s, 18 * s, -8 * s);
        ctx.closePath();
        ctx.fillStyle = robeColor;
        ctx.fill();
        ctx.stroke();

        // 腰带
        ctx.fillStyle = beltColor;
        ctx.fillRect(-18 * s, 16 * s, 36 * s, 5 * s);
        ctx.fillStyle = '#c8a080';
        ctx.fillRect(-4 * s, 15 * s, 8 * s, 7 * s);

        // 袖子
        ctx.save();
        ctx.translate(-18 * s, -2 * s);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-18 * s, 6 * s, -22 * s, 16 * s);
        ctx.quadraticCurveTo(-14 * s, 18 * s, -4 * s, 10 * s);
        ctx.closePath();
        ctx.fillStyle = sleeveColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,50,0.3)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(18 * s, -2 * s);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(18 * s, 6 * s, 22 * s, 16 * s);
        ctx.quadraticCurveTo(14 * s, 18 * s, 4 * s, 10 * s);
        ctx.closePath();
        ctx.fillStyle = sleeveColor;
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 手臂
        ctx.save();
        var armSpread = isEmbracing ? 0.6 : 0.2;
        ctx.translate(-16 * s, 0);
        ctx.rotate(-0.2 - armSpread * (1 - armAngle));
        ctx.fillStyle = sleeveColor;
        ctx.fillRect(-3 * s, 0, 6 * s, 22 * s);
        ctx.strokeStyle = 'rgba(60,40,50,0.2)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(-3 * s, 0, 6 * s, 22 * s);
        ctx.restore();

        ctx.save();
        ctx.translate(16 * s, 0);
        ctx.rotate(0.2 + armSpread * (1 - armAngle));
        ctx.fillStyle = sleeveColor;
        ctx.fillRect(-3 * s, 0, 6 * s, 22 * s);
        ctx.strokeStyle = 'rgba(60,40,50,0.2)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(-3 * s, 0, 6 * s, 22 * s);
        ctx.restore();

        // 头部
        ctx.fillStyle = skinColor;
        ctx.fillRect(-4 * s, -18 * s, 8 * s, 10 * s);

        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(0, -28 * s, 14 * s, 16 * s, 0, 0, Math.PI * 2);
        ctx.fillStyle = skinColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,50,0.2)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // 头发
        ctx.shadowBlur = 15;
        if (gender === 'man') {
            ctx.beginPath();
            ctx.arc(0, -38 * s, 12 * s, 0, Math.PI * 2);
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.fillStyle = '#8a5a5a';
            ctx.fillRect(-14 * s, -40 * s, 28 * s, 2 * s);
            ctx.beginPath();
            ctx.arc(0, -44 * s, 6 * s, 0, Math.PI * 2);
            ctx.fillStyle = hairColor;
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(0, -34 * s, 14 * s, 0, Math.PI * 2);
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-14 * s, -28 * s);
            ctx.quadraticCurveTo(-20 * s, -10 * s, -16 * s, 12 * s);
            ctx.quadraticCurveTo(-12 * s, 4 * s, -8 * s, -10 * s);
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(14 * s, -28 * s);
            ctx.quadraticCurveTo(20 * s, -10 * s, 16 * s, 12 * s);
            ctx.quadraticCurveTo(12 * s, 4 * s, 8 * s, -10 * s);
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#d4a0b0';
            ctx.beginPath();
            ctx.arc(0, -40 * s, 4 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f0c8d0';
            ctx.beginPath();
            ctx.arc(0, -40 * s, 2 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 15;
        }

        // 五官
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#2a1a1a';
        var eyeY = -30 * s;
        if (gender === 'man') {
            ctx.fillRect(-6 * s, eyeY, 2.5 * s, 3 * s);
            ctx.fillRect(3.5 * s, eyeY, 2.5 * s, 3 * s);
        } else {
            ctx.fillRect(-6 * s, eyeY, 3 * s, 3.5 * s);
            ctx.fillRect(3 * s, eyeY, 3 * s, 3.5 * s);
            ctx.strokeStyle = '#2a1a1a';
            ctx.lineWidth = 0.5;
            for (var i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-7 * s + i * 1.5 * s, eyeY - 1 * s);
                ctx.lineTo(-8 * s + i * 1.5 * s, eyeY - 4 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(4 * s + i * 1.5 * s, eyeY - 1 * s);
                ctx.lineTo(5 * s + i * 1.5 * s, eyeY - 4 * s);
                ctx.stroke();
            }
        }

        ctx.strokeStyle = '#3a2a2a';
        ctx.lineWidth = 1.2 * s;
        ctx.beginPath();
        ctx.moveTo(-8 * s, -34 * s);
        ctx.quadraticCurveTo(-5 * s, -37 * s, -2 * s, -34 * s);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8 * s, -34 * s);
        ctx.quadraticCurveTo(5 * s, -37 * s, 2 * s, -34 * s);
        ctx.stroke();

        ctx.strokeStyle = '#8a4a5a';
        ctx.lineWidth = 1 * s;
        ctx.beginPath();
        ctx.arc(0, -24 * s, 4 * s, 0.1, Math.PI - 0.1);
        ctx.stroke();

        if (gender === 'woman') {
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(200,100,120,0.08)';
            ctx.beginPath();
            ctx.arc(0, -28 * s, 12 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#d4a0b0';
            ctx.beginPath();
            ctx.arc(0, -32 * s, 1.5 * s, 0, Math.PI * 2);
            ctx.fill();
        }

        // ===== 头顶名字 =====
        ctx.restore(); // 先恢复之前的变换
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(200,150,180,0.15)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        // 名字背景（古风卷轴效果）
        var nameWidth = ctx.measureText(name).width + 30;
        var nameX = x - nameWidth / 2;
        var nameY = y - 58 * s;
        // 半透明底条
        ctx.fillStyle = 'rgba(20,10,20,0.5)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(200,150,180,0.05)';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(nameX, nameY - 12, nameWidth, 26, 6) : ctx.rect(nameX, nameY - 12, nameWidth, 26);
        ctx.fill();
        // 名字文字
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(200,150,180,0.2)';
        ctx.fillStyle = (gender === 'man') ? '#e8c8b0' : '#f0c8d8';
        ctx.font = '16px "STKaiti","华文楷体",serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(name, x, nameY + 2);
        // 小装饰线
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(200,150,180,0.1)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(nameX + 8, nameY + 16);
        ctx.lineTo(nameX + nameWidth - 8, nameY + 16);
        ctx.stroke();

        ctx.restore();
    }

    // -------- 绘制背景 --------
    function drawBackground() {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0d0a10');
        grad.addColorStop(0.5, '#1a1018');
        grad.addColorStop(1, '#0f0a0d');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(30,20,30,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.6);
        for (var i = 0; i <= W; i += 2) {
            var y = H * 0.6 + 30 * Math.sin(i * 0.008) + 20 * Math.sin(i * 0.015 + 1) + 10;
            ctx.lineTo(i, y);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        ctx.shadowColor = 'rgba(200,180,200,0.08)';
        ctx.shadowBlur = 60;
        ctx.beginPath();
        ctx.arc(380, 60, 30, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200,190,200,0.06)';
        ctx.fill();
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(380, 60, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220,210,220,0.08)';
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = 'rgba(60,40,50,0.1)';
        ctx.lineWidth = 0.5;
        for (var j = 0; j < 8; j++) {
            var x = 20 + j * 60;
            ctx.beginPath();
            ctx.moveTo(x, 10);
            ctx.lineTo(x, 50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, 10);
            ctx.lineTo(x + 30, 30);
            ctx.stroke();
        }
    }

    // -------- 绘制花瓣 --------
    function drawPetals() {
        for (var i = 0; i < petals.length; i++) {
            var p = petals[i];
            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.phase + p.y * 0.01);
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(200,150,180,0.1)';
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.4, p.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -2, p.size * 0.3, p.size * 0.5, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            p.y += p.speed;
            p.x += Math.sin(p.phase + p.y * 0.02) * p.wobble;
            if (p.y > H + 20) {
                p.y = -20;
                p.x = Math.random() * W;
            }
        }
    }

    // -------- 主绘制 --------
    function drawScene() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();

        var man = person.man;
        var woman = person.woman;

        var t = Math.min(progress, 1);
        var ease = t * t * (3 - 2 * t);

        var manX = 170 + (220 - 170) * ease;
        var womanX = 310 + (260 - 310) * ease;
        var armAngle = ease;

        // 先画男（肉片），再画女（大小姐）
        drawPerson(manX, 310, 1, 'man', armAngle, ease > 0.5, '肉片');
        drawPerson(womanX, 310, 1, 'woman', armAngle, ease > 0.5, '大小姐');

        drawPetals();

        if (ease > 0.7) {
            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(200,150,180,0.2)';
            ctx.fillStyle = 'rgba(180,150,170,0.06)';
            ctx.font = '14px "STKaiti","华文楷体",serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌺 与君相拥 · 不负此生 🌺', W / 2, 550);
            ctx.restore();
        }

        ctx.strokeStyle = 'rgba(60,40,50,0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(6, 6, W - 12, H - 12);
        ctx.strokeRect(10, 10, W - 20, H - 20);
    }

    // -------- 动画循环 --------
    function animate() {
        if (!paused) {
            if (isPlaying && progress < 1) {
                progress += 0.006;
                if (progress > 1) progress = 1;
            }
            drawScene();
        }
        animId = requestAnimationFrame(animate);
    }

    // -------- 控制按钮 --------
    document.getElementById('playBtn').addEventListener('click', function() {
        if (progress >= 1) {
            progress = 0;
        }
        isPlaying = true;
        paused = false;
        this.textContent = '▶ 播放中';
    });

    document.getElementById('pauseBtn').addEventListener('click', function() {
        paused = !paused;
        this.textContent = paused ? '▶ 继续' : '⏸️ 暂停';
        document.getElementById('playBtn').textContent = paused ? '▶ 播放' : '▶ 播放中';
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
        progress = 0;
        isPlaying = false;
        paused = false;
        document.getElementById('playBtn').textContent = '▶ 播放';
        document.getElementById('pauseBtn').textContent = '⏸️ 暂停';
        drawScene();
    });

    // -------- 启动 --------
    animate();
    drawScene();
</script>
</body>
</html>
