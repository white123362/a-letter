<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 AI游戏大厅</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0a0a;color:#ddd;font-family:'Segoe UI',Arial,sans-serif;padding:12px;min-height:100vh;display:flex;justify-content:center;}
        .box{max-width:500px;width:100%;background:#121212;border-radius:16px;padding:20px;border:1px solid #2a2a2a;}
        h1{color:#f5c842;text-align:center;font-size:22px;margin-bottom:4px;}
        .sub{text-align:center;color:#888;font-size:13px;border-bottom:1px solid #1a1a2a;padding-bottom:12px;margin-bottom:12px;}
        .game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
        .game-card{background:#0a0a18;border:1px solid #1a2a3a;border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:0.2s;}
        .game-card:hover{background:#1a1a2e;border-color:#f5c842;transform:scale(1.02);}
        .game-card .icon{font-size:28px;display:block;margin-bottom:4px;}
        .game-card .gname{color:#f5c842;font-size:14px;font-weight:bold;}
        .game-card .gdesc{color:#888;font-size:11px;margin-top:2px;}
        .game-card .tag{font-size:9px;background:#1a3a2a;color:#4fc3f7;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:4px;}
        .back-btn{background:#1a1a2e;border:1px solid #2a2a2a;color:#888;padding:10px;border-radius:30px;font-size:14px;cursor:pointer;width:100%;margin-top:8px;}
        .back-btn:hover{border-color:#f5c842;color:#f5c842;}
        .hidden{display:none;}
        .scene{background:#0a0a18;padding:14px;border-radius:12px;border-left:3px solid #f5c842;margin:10px 0;font-size:14px;line-height:1.8;min-height:60px;max-height:300px;overflow-y:auto;}
        .scene .hl{color:#f5c842;}
        .scene .dr{color:#ff6b6b;}
        .scene .gray{color:#888;}
        .scene .event{color:#4fc3f7;}
        .chat-area{background:#0a0a18;border-radius:12px;border:1px solid #1a2a3a;padding:12px;margin:10px 0;max-height:300px;overflow-y:auto;}
        .chat-msg{padding:6px 12px;margin:4px 0;border-radius:10px;font-size:14px;max-width:92%;}
        .chat-msg.player{background:#1a2a4a;color:#a8d8ea;text-align:right;margin-left:auto;border-bottom-right-radius:4px;}
        .chat-msg.ai{background:#1a2a2a;color:#ddd;text-align:left;border-bottom-left-radius:4px;}
        .chat-msg.ai .name{color:#f5c842;font-weight:bold;}
        .chat-msg.system{background:#1a1a1a;color:#888;text-align:center;font-style:italic;max-width:100%;font-size:13px;}
        .chat-msg.hint{background:#0a1a2a;color:#4fc3f7;text-align:center;max-width:100%;font-size:13px;border:1px dashed #2a4a5a;}
        .input-row{display:flex;gap:8px;margin:8px 0;}
        .input-row input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #2a3a5e;background:#0a0a18;color:#eee;font-size:15px;}
        .input-row input:focus{outline:none;border-color:#f5c842;}
        .input-row input:disabled{opacity:0.4;}
        .input-row button{background:#f5c842;border:none;color:#1a1a2e;padding:12px 20px;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer;}
        .input-row button:hover{background:#ffd966;}
        .input-row button:disabled{opacity:0.3;cursor:not-allowed;}
        .btn{background:#f5c842;border:none;color:#1a1a2e;padding:14px;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;width:100%;transition:0.2s;margin-top:8px;}
        .btn:hover{background:#ffd966;}
        .btn:disabled{opacity:0.3;cursor:not-allowed;}
        .btn-secondary{background:#1a1a2e;border:1px solid #2a2a2a;color:#888;margin-top:6px;}
        .btn-secondary:hover{border-color:#f5c842;color:#f5c842;}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;animation:fadeIn 0.3s ease;}
        .modal-overlay.hidden{display:none;}
        .modal-box{max-width:460px;width:100%;background:#1a1a2e;border-radius:20px;padding:28px 24px;border:3px solid #f5c842;box-shadow:0 0 60px rgba(245,200,66,0.15);max-height:90vh;overflow-y:auto;animation:slideUp 0.4s ease;}
        .modal-box.danger{border-color:#ff0000;box-shadow:0 0 60px rgba(255,0,0,0.25);animation:slideUp 0.4s ease,shake 0.5s ease;}
        .modal-box .modal-title{text-align:center;font-size:22px;font-weight:bold;color:#f5c842;margin-bottom:12px;border-bottom:1px solid #2a2a2a;padding-bottom:12px;}
        .modal-box .modal-body{font-size:15px;line-height:1.9;color:#ddd;padding:8px 0;}
        .modal-box .modal-body .hl{color:#f5c842;}
        .modal-box .modal-body .dr{color:#ff6b6b;}
        .modal-box .modal-btn{display:block;width:100%;padding:14px;margin-top:16px;border:none;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;background:#f5c842;color:#1a1a2e;}
        .modal-box .modal-btn:hover{background:#ffd966;}
        .modal-box.danger .modal-btn{background:#ff0000;color:#fff;}
        .modal-box.danger .modal-btn:hover{background:#cc0000;}
        .modal-box .modal-choice{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
        .modal-box .modal-choice button{background:#0a0a18;border:1px solid #2a3a5e;color:#eee;padding:12px 16px;border-radius:10px;font-size:14px;text-align:left;cursor:pointer;transition:0.2s;}
        .modal-box .modal-choice button:hover{background:#252545;border-color:#f5c842;}
        .modal-box .modal-choice button.danger{border-color:#6a2a2a;}
        .modal-box .modal-choice button.danger:hover{background:#2a0a0a;border-color:#ff0000;}
        .modal-box .modal-choice button.love{border-color:#2a5a6a;}
        .modal-box .modal-choice button.love:hover{background:#0a2a3a;border-color:#4fc3f7;}
        .register-area{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
        .register-area input,.register-area select{padding:12px 14px;border-radius:10px;border:1px solid #2a3a5e;background:#0a0a18;color:#eee;font-size:15px;width:100%;}
        .register-area input:focus,.register-area select:focus{outline:none;border-color:#f5c842;}
        .register-area .row{display:flex;gap:10px;}
        .register-area .row input,.register-area .row select{flex:1;}
        .note{color:#555;font-size:11px;text-align:center;margin-top:8px;}
        .back-link{display:block;text-align:center;color:#888;font-size:13px;margin-top:12px;text-decoration:none;border-top:1px solid #1a1a2a;padding-top:12px;}
        .back-link:hover{color:#f5c842;}
        .badge-ai{background:#1a3a2a;color:#4fc3f7;font-size:9px;padding:2px 8px;border-radius:8px;margin-left:4px;border:1px solid #2a5a4a;}
        .game-title{font-size:20px;color:#f5c842;text-align:center;}
        .game-sub{text-align:center;color:#888;font-size:13px;margin-bottom:8px;}
        @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
        @keyframes slideUp{0%{transform:translateY(40px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
        @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-12px);}40%{transform:translateX(12px);}60%{transform:translateX(-8px);}80%{transform:translateX(8px);}}
    </style>
</head>
<body>
<div class="box">
    <div id="homePage">
        <h1>🎮 AI游戏大厅</h1>
        <div class="sub">7种AI游戏 · 全部接入DeepSeek</div>
        <div class="game-grid" id="gameGrid"></div>
        <div class="note">💡 点击卡片进入游戏 · AI实时响应</div>
    </div>

    <div id="gamePage" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="game-title" id="gameTitle">🎮 游戏</span>
            <button class="back-btn" id="backHomeBtn" style="width:auto;padding:6px 16px;margin:0;">← 返回</button>
        </div>
        <div class="game-sub" id="gameSub">游戏说明</div>
        <div class="scene" id="sceneDisplay"></div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-row">
            <input type="text" id="msgInput" placeholder="输入..." maxlength="300" disabled>
            <button id="sendBtn" disabled>发送</button>
        </div>
        <button class="btn btn-secondary" id="actionBtn" style="display:none;">▶ 继续</button>
        <button class="btn btn-secondary" id="resetGameBtn">🔄 重新开始</button>
        <div class="note" id="gameNote">💡 输入你的回答或提问</div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box" id="modalBox">
        <div class="modal-title" id="modalTitle">📢</div>
        <div class="modal-body" id="modalBody"></div>
        <button class="modal-btn" id="modalBtn">知道了</button>
    </div>
</div>

<script>
var API_KEY = 'sk-63de969541fa4461867119dd72aba997';
var API_URL = 'https://api.deepseek.com/v1/chat/completions';

var currentGame = null;
var gameState = {};
var isAILoading = false;

function callAI(messages, callback) {
    if (!API_KEY) { callback('请设置 API Key'); return; }
    var data = {
        model: 'deepseek-chat',
        messages: messages,
        max_tokens: 300,
        temperature: 0.9
    };
    fetch(API_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify(data)
    })
    .then(function(response) {
        if (!response.ok) {
            if (response.status === 401) throw new Error('API Key 无效');
            if (response.status === 429) throw new Error('请求太频繁');
            if (response.status === 402) throw new Error('余额不足');
            throw new Error('网络错误');
        }
        return response.json();
    })
    .then(function(json) {
        if (json.choices && json.choices.length > 0) {
            callback(null, json.choices[0].message.content.trim());
        } else {
            callback('AI 没有返回有效回复');
        }
    })
    .catch(function(error) {
        callback(error.message);
    });
}

var GAMES = [
    { id: 'detective', icon: '🔍', name: '侦探推理', desc: '审问AI嫌疑人，找出真凶', tag: '推理' },
    { id: 'survival', icon: '🏔️', name: '生存冒险', desc: 'AI生成事件，你选择生死', tag: '生存' },
    { id: 'rpg', icon: '💬', name: '角色扮演', desc: '自定义角色，AI陪你演', tag: '扮演' },
    { id: 'psych', icon: '🧠', name: '心理测试', desc: 'AI分析你的内心世界', tag: '测试' },
    { id: 'love', icon: '💕', name: '恋爱模拟', desc: 'AI恋人，记住你的喜好', tag: '恋爱' },
    { id: 'debate', icon: '⚖️', name: '谈判挑战', desc: '靠嘴炮说服AI对手', tag: '谈判' },
    { id: 'seaturtle', icon: '🍲', name: '海龟汤', desc: '提问还原离奇真相', tag: '推理' }
];

function shuffleArray(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickOne(a){return a[Math.floor(Math.random()*a.length)];}

function showModal(title,body,btnText,isDanger,cb){
    var ov=document.getElementById('modalOverlay'),box=document.getElementById('modalBox');
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=body;
    document.getElementById('modalBtn').textContent=btnText||'知道了';
    box.className='modal-box'+(isDanger?' danger':'');
    ov.classList.remove('hidden');
    document.getElementById('modalBtn').onclick=function(){ov.classList.add('hidden');if(cb)cb();};
    if(isDanger){box.style.animation='none';setTimeout(function(){box.style.animation='slideUp 0.4s ease, shake 0.5s ease';},10);}
}

function addChat(who, text, type){
    var area=document.getElementById('chatArea');
    var div=document.createElement('div');
    div.className='chat-msg '+type;
    if(type==='player'){div.innerHTML='你：'+text;}
    else if(type==='ai'){div.innerHTML='<span class="name">'+(who||'AI')+'</span>：'+text;}
    else if(type==='hint'){div.innerHTML='💡 '+text;}
    else{div.innerHTML='[系统] '+text;}
    area.appendChild(div);
    area.scrollTop=area.scrollHeight;
}

function clearChat(){document.getElementById('chatArea').innerHTML='';}

function setInputEnabled(enabled){
    document.getElementById('msgInput').disabled=!enabled;
    document.getElementById('sendBtn').disabled=!enabled;
}

function renderHome(){
    var grid=document.getElementById('gameGrid');grid.innerHTML='';
    GAMES.forEach(function(g){
        var div=document.createElement('div');
        div.className='game-card';
        div.innerHTML='<span class="icon">'+g.icon+'</span><div class="gname">'+g.name+'</div><div class="gdesc">'+g.desc+'</div><span class="tag">'+g.tag+'</span>';
        div.onclick=function(){enterGame(g.id);};
        grid.appendChild(div);
    });
}

function enterGame(id){
    currentGame=id;
    document.getElementById('homePage').classList.add('hidden');
    document.getElementById('gamePage').classList.remove('hidden');
    var g=GAMES.find(function(x){return x.id===id;});
    document.getElementById('gameTitle').textContent=g.icon+' '+g.name;
    document.getElementById('gameSub').textContent=g.desc;
    clearChat();
    gameState={step:0,history:[],over:false};
    setInputEnabled(false);
    document.getElementById('actionBtn').style.display='none';
    document.getElementById('gameNote').textContent='⏳ AI 正在准备...';
    startGame(id);
}
    function startGame(id){
    if(id==='detective'){startDetective();}
    else if(id==='survival'){startSurvival();}
    else if(id==='rpg'){startRPG();}
    else if(id==='psych'){startPsych();}
    else if(id==='love'){startLove();}
    else if(id==='debate'){startDebate();}
    else if(id==='seaturtle'){startSeaTurtle();}
}

// ============================================================
//  🍲 海龟汤
// ============================================================
function startSeaTurtle(){
    var system = '你是海龟汤游戏的主持人。' +
        '你会给出一个离奇的故事结局（汤面），玩家通过提问来还原完整故事（汤底）。' +
        '你只能回答：是、否、无关（跟故事没有关系）。' +
        '如果玩家直接输入了完整的汤底推理，判断是否正确。' +
        '汤底必须是一个完整、合理、有逻辑的故事。' +
        '不要主动透露汤底，不要提示。' +
        '每次回答后，给出一个简短的提示（可选）。';
    var user = '请给我一个海龟汤的汤面。不要告诉我汤底。';
    var msgs = [{role:'system',content:system},{role:'user',content:user}];
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');setInputEnabled(true);return;}
        addChat('AI','🍲 汤面：'+reply,'ai');
        gameState.history=[{role:'system',content:system},{role:'assistant',content:reply}];
        gameState.汤底 = null;
        gameState.step=1;
        setInputEnabled(true);
        document.getElementById('gameNote').textContent='💡 提问还原真相 · AI只能回答是/否/无关';
    });
}

function onSeaTurtleInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:text});
    var system = msgs[0].content;
    var check = '玩家输入了完整的汤底推理。请判断是否正确。如果正确，回复"✅ 正确！"并给出完整故事。如果错误，回复"❌ 不对，再想想"并给出一个提示。';
    var checkMsgs = [{role:'system',content:system},{role:'user',content:'玩家的推理是："'+text+'"\n\n'+check}];
    callAI(checkMsgs, function(err, reply2){
        if(err){addChat('系统','错误：'+err,'system');return;}
        if(reply2.indexOf('✅')!==-1 || reply2.indexOf('正确')!==-1){
            addChat('AI',reply2,'ai');
            gameState.over=true;
            setInputEnabled(false);
            document.getElementById('gameNote').textContent='🎉 恭喜你猜对了！点击"重新开始"再玩一局';
            return;
        }
        // 普通提问
        var qMsgs = gameState.history.slice();
        qMsgs.push({role:'user',content:text});
        callAI(qMsgs, function(err2, reply3){
            if(err2){addChat('系统','错误：'+err2,'system');return;}
            addChat('AI',reply3,'ai');
            gameState.history.push({role:'user',content:text});
            gameState.history.push({role:'assistant',content:reply3});
        });
    });
}

// ============================================================
//  🔍 侦探推理
// ============================================================
function startDetective(){
    var system = '你是一个案件的嫌疑人。你被警察审问。' +
        '你犯了罪，但你不能直接承认。' +
        '你要在对话中逐渐露出破绽，但不要主动坦白。' +
        '每次回答要符合角色设定，像真人一样说话。' +
        '玩家需要找到你的破绽，迫使你认罪。';
    var user = '给我一个案件背景和你的角色设定。';
    var msgs = [{role:'system',content:system},{role:'user',content:user}];
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');setInputEnabled(true);return;}
        addChat('AI','🔍 '+reply,'ai');
        gameState.history=[{role:'system',content:system},{role:'assistant',content:reply}];
        setInputEnabled(true);
        document.getElementById('gameNote').textContent='💡 审问AI嫌疑人，找出真相';
    });
}

function onDetectiveInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:text});
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');return;}
        addChat('AI',reply,'ai');
        gameState.history.push({role:'user',content:text});
        gameState.history.push({role:'assistant',content:reply});
        if(reply.indexOf('我认罪')!==-1 || reply.indexOf('我承认')!==-1){
            addChat('系统','🎉 凶手认罪了！','system');
            setInputEnabled(false);
            document.getElementById('gameNote').textContent='🎉 你破案了！点击"重新开始"再玩一局';
        }
    });
}

// ============================================================
//  🏔️ 生存冒险
// ============================================================
function startSurvival(){
    var system = '你是一个生存冒险游戏的主持人。' +
        '你会在荒野中生成随机事件，让玩家选择行动。' +
        '每个事件有两个选择，会影响玩家的生存状态。' +
        '玩家的初始状态：生命100，饥饿50，寒冷50。' +
        '你要根据玩家的选择更新状态，并生成后续事件。' +
        '游戏目标是生存尽可能多的天数。';
    var user = '开始游戏。描述玩家的初始场景和第一个事件。';
    var msgs = [{role:'system',content:system},{role:'user',content:user}];
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');setInputEnabled(true);return;}
        addChat('AI','🏔️ '+reply,'ai');
        gameState.history=[{role:'system',content:system},{role:'assistant',content:reply}];
        gameState.life=100;gameState.hunger=50;gameState.cold=50;gameState.day=1;
        setInputEnabled(true);
        document.getElementById('gameNote').textContent='💡 输入你的选择（如：A / B）';
    });
}

function onSurvivalInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:'我的选择是：'+text});
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');return;}
        addChat('AI',reply,'ai');
        gameState.history.push({role:'user',content:'我的选择是：'+text});
        gameState.history.push({role:'assistant',content:reply});
        if(reply.indexOf('死亡')!==-1 || reply.indexOf('你死了')!==-1){
            addChat('系统','💀 你死了！游戏结束','system');
            setInputEnabled(false);
            document.getElementById('gameNote').textContent='💀 游戏结束 · 点击"重新开始"再玩一局';
        }else{gameState.day++;}
    });
}

// ============================================================
//  💬 角色扮演
// ============================================================

        '玩家可以设定一个角色，你扮演那个角色。' +
        '根据玩家的设定，生成一个场景，然后让玩家和AI角色对话。' +

    var user = '玩家想扮演一个角色。请先询问玩家想扮演什么角色。';
    var msgs = [{role:'system',content:system},{role:'user',content:user}];
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');setInputEnabled(true);return;}
        addChat('AI','💬 '+reply,'ai');
        gameState.history=[{role:'system',content:system},{role:'assistant',content:reply}];
        setInputEnabled(true);
        document.getElementById('gameNote').textContent='💡 告诉AI你想扮演什么角色';
    });
}

function onRPGInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:text});
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');return;}
        addChat('AI',reply,'ai');
        gameState.history.push({role:'user',content:text});
        gameState.history.push({role:'assistant',content:reply});
    });
}

//  💕 恋爱模拟
// ============================================================
function startLove(){
    var system = '你是一个恋爱模拟角色。' +
        '你是玩家的恋人，温柔、体贴、有点小傲娇。' +
        '你要记住玩家说过的话，在后续对话中体现出来。' +
        '好感度初始50，根据玩家的回答增减。' +
        '每次回复后，在括号里标注好感度变化（如：好感度+2）。' +
        '如果好感度达到80，表白；低于20，分手。';
    var user = '你好呀，今天天气真好。';
    var msgs = [{role:'system',content:system},{role:'user',content:user}];
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');setInputEnabled(true);return;}
        addChat('AI','💕 '+reply,'ai');
        gameState.history=[{role:'system',content:system},{role:'assistant',content:reply}];
        gameState.love=50;
        setInputEnabled(true);
        document.getElementById('gameNote').textContent='💕 好感度：'+gameState.love+' · 你的话会影响感情';
    });
}

function onLoveInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:text});
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');return;}
        addChat('AI',reply,'ai');
        gameState.history.push({role:'user',content:text});
        gameState.history.push({role:'assistant',content:reply});
        var loveMatch=reply.match(/好感度[+\-]?(\d+)/);
        if(loveMatch){gameState.love=parseInt(loveMatch[1]);}
        else if(reply.indexOf('表白')!==-1){gameState.love=80;}
        else if(reply.indexOf('分手')!==-1){gameState.love=15;}
        document.getElementById('gameNote').textContent='💕 好感度：'+gameState.love+' · 你的话会影响感情';
        if(gameState.love>=80){addChat('系统','🎉 对方表白了！','system');setInputEnabled(false);}
        else if(gameState.love<20){addChat('系统','💔 对方离开了...','system');setInputEnabled(false);}
    });
}

function onDebateInput(text){
    var msgs = gameState.history.slice();
    msgs.push({role:'user',content:text});
    callAI(msgs, function(err, reply){
        if(err){addChat('系统','错误：'+err,'system');return;}

        gameState.history.push({role:'user',content:text});
        gameState.history.push({role:'assistant',content:reply});

            addChat('系统','🎉 你赢了！','system');

            document.getElementById('gameNote').textContent='🎉 你赢了 · 点击"重新开始"再玩一局';

            addChat('系统','😤 你输了！','system');
            setInputEnabled(false);
            document.getElementById('gameNote').textContent='😤 你输了 · 点击"重新开始"再玩一局';
        }
    });
}

//  输入分发器
// ============================================================
document.getElementById('sendBtn').addEventListener('click', function() {
    if (isAILoading) return;
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    addChat('你', text, 'player');

    if (currentGame === 'detective') onDetectiveInput(text);
    else if (currentGame === 'survival') onSurvivalInput(text);
    else if (currentGame === 'rpg') onRPGInput(text);
    else if (currentGame === 'psych') onPsychInput(text);
    else if (currentGame === 'love') onLoveInput(text);
    else if (currentGame === 'debate') onDebateInput(text);
    else if (currentGame === 'seaturtle') onSeaTurtleInput(text);
});

document.getElementById('msgInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
});

document.getElementById('backHomeBtn').addEventListener('click', function() {
    document.getElementById('gamePage').classList.add('hidden');
    document.getElementById('homePage').classList.remove('hidden');
    setInputEnabled(false);
});

document.getElementById('resetGameBtn').addEventListener('click', function() {
    if (currentGame) {
        clearChat();
        gameState = {step:0,history:[],over:false};
        setInputEnabled(false);
        startGame(currentGame);
        document.getElementById('gameNote').textContent='🔄 重新开始...';
    }
});

renderHome();
</script>
