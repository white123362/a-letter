<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>密室杀人 · 推理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;color:#ddd;font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;}
.box{background:#121212;padding:24px;border-radius:16px;max-width:100%;width:100%;border:1px solid #2a2a2a;}
h1{color:#f5c842;text-align:center;font-size:24px;margin-bottom:4px;}
.sub{font-size:14px;color:#888;text-align:center;margin-bottom:16px;border-bottom:1px solid #1a1a2a;padding-bottom:12px;}
.stats{display:flex;justify-content:space-between;margin-bottom:12px;gap:8px;}
.stat-box{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;}
.stat-box.purity{background:#0a1a2a;border:1px solid #2a5a6a;}
.stat-box.purity .val{color:#4fc3f7;}
.stat-box.corruption{background:#1a0a0a;border:1px solid #6a2a2a;}
.stat-box.corruption .val{color:#ff6b6b;}
.stat-box.balance{background:#1a1a0a;border:1px solid #5a5a2a;}
.stat-box.balance .val{color:#f5c842;}
.death-count{font-size:13px;color:#ff6b6b;text-align:center;margin-bottom:10px;}
.scene{background:#0a0a18;padding:16px;border-radius:12px;border-left:3px solid #f5c842;margin:12px 0;line-height:1.8;font-size:16px;min-height:110px;}
.scene .hl{color:#f5c842;}
.scene .dr{color:#ff6b6b;}
.scene .gray{color:#888;}
.scene .clue-highlight{color:#4fc3f7;font-weight:bold;}
.options{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.options button{background:#1a1a2e;border:1px solid #2a3a5e;color:#eee;padding:14px 16px;border-radius:12px;text-align:left;font-size:16px;cursor:pointer;transition:0.2s;}
.options button:hover{background:#252545;border-color:#f5c842;}
.options button:disabled{opacity:0.3;cursor:not-allowed;}
.msg{background:#0a0a18;padding:12px;border-radius:10px;border:1px solid #1a2a3a;font-size:14px;color:#a8d8ea;margin:12px 0;min-height:40px;}
.msg .ok{color:#4caf50;font-weight:bold;}
.msg .fail{color:#ff6b6b;font-weight:bold;}
.input-area{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
.input-area input{flex:1;min-width:150px;padding:14px;border-radius:12px;border:1px solid #2a3a5e;background:#0a0a18;color:#eee;font-size:16px;}
.input-area input:focus{outline:none;border-color:#f5c842;}
.input-area button{background:#f5c842;border:none;color:#1a1a2e;padding:14px 24px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;}
.input-area button:hover{background:#ffd966;}
.btn-next{background:#f5c842;border:none;color:#1a1a2e;padding:16px;border-radius:30px;font-weight:bold;font-size:18px;cursor:pointer;width:100%;transition:0.2s;}
.btn-next:hover{background:#ffd966;}
.btn-next:disabled{opacity:0.3;cursor:not-allowed;}
.btn-reset{background:#1a1a2e;border:1px solid #2a2a2a;color:#888;padding:12px;border-radius:20px;font-size:15px;cursor:pointer;width:100%;margin-top:10px;transition:0.2s;}
.btn-reset:hover{border-color:#ff6b6b;color:#ff6b6b;}
.hidden{display:none;}
.image-box{background:#0a0a14;border:1px dashed #2a3a5e;border-radius:12px;padding:12px;text-align:center;margin:12px 0;}
.image-box img{max-width:100%;border-radius:8px;max-height:250px;}
.image-box .cap{color:#888;font-size:12px;margin-top:4px;}
.death-screen{background:#1a0000;border:3px solid #ff0000;border-radius:12px;padding:24px;text-align:center;margin:12px 0;}
.death-screen .icon{font-size:60px;}
.death-screen .title{color:#ff0000;font-size:24px;font-weight:bold;margin:8px 0;}
.death-screen .desc{color:#ff6b6b;font-size:16px;line-height:1.8;}
.death-screen .btn-retry{background:#ff0000;border:none;color:#fff;padding:14px 40px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:16px;}
.death-screen .btn-retry:hover{background:#cc0000;}
.end-icon{text-align:center;font-size:44px;padding:12px 0 4px 0;}
.end-title{text-align:center;font-size:20px;color:#f5c842;}
.end-desc{text-align:center;font-size:14px;color:#aaa;padding:12px;line-height:1.8;}
.clue-box{background:#0a0a18;padding:12px;border-radius:10px;border:1px solid #2a3a5e;margin:8px 0;font-size:14px;}
.clue-box .cl{color:#f5c842;}
</style>
</head>
<body>
<div class="box">
<h1>🔪 密室杀人 · 推理</h1>
<div class="stats">
<div class="stat-box purity">🕊️ 纯洁度 <span class="val" id="purityVal">50</span></div>
<div class="stat-box corruption">🌑 污染度 <span class="val" id="corruptVal">50</span></div>
<div class="stat-box balance">⚖️ 平衡 <span class="val" id="balanceVal">0</span></div>
</div>
<div class="death-count">💀 死亡次数：<span id="deathCount">0</span></div>
<div class="sub">第 <span id="chap">1</span> 章 · <span id="sname">密室</span></div>
<div class="scene" id="scene"></div>
<div id="imgBox" class="image-box hidden">
<img id="imgShow" src="72776.jpeg" alt="物证">
<div class="cap" id="imgCap">关键物证</div>
</div>
<div id="clueBox" class="clue-box hidden">
🔍 已收集线索：<span id="clueList" style="color:#f5c842;"></span>
</div>
<div id="options" class="options"></div>
<div id="inputArea" class="input-area hidden">
<input type="text" id="answerInput" placeholder="输入你的推理...">
<button id="submitAnswer">提交推理</button>
</div>
<div class="msg" id="msg">点击选项推进剧情</div>
<button class="btn-next" id="nextBtn" disabled>继续</button>
<button class="btn-reset" id="resetBtn">重新开始</button>
</div>

<script>
// ========== 游戏状态 ==========
var purity = 50;
var corruption = 50;
var deathCount = 0;
var currentSceneIdx = 0;
var collectedClues = [];
var gameOver = false;
var wrongAttempts = 0;
var maxWrongAttempts = 3;
var currentPuzzle = null;
var puzzleCompleted = {method:false,killer:false,evidence:false};

// ========== 推理题数据 ==========
var puzzles = {
method: {
question: '🔍 <span class="clue-highlight">推理题 1/3：密室手法</span><br><br>现场门从内侧反锁，钥匙在死者口袋里，窗户从内侧锁死。但地上有一小滩水渍，没有其他痕迹。<br><br><span class="gray">❓ 凶手是用什么方法从外面锁上门的？</span><br><span style="color:#888;font-size:14px;">💡 提示：与水有关，融化后消失</span>',
answers: ['冰线','冰块','冰','冷冻','结冰','冰绳','水线','冰丝'],
correctMsg: '✅ 正确！凶手用冰线从门缝穿过，拉动门闩后冰融化成水。这就是密室手法！',
wrongMsg: '❌ 再想想……现场有水渍，但没有任何工具残留。'
},
killer: {
question: '🔍 <span class="clue-highlight">推理题 2/3：凶手身份</span><br><br>死者手里紧握着一片黄色布料。咖啡馆店员手腕上有旧伤疤，你见过她。<br><br><span class="gray">❓ 凶手是谁？</span><br><span style="color:#888;font-size:14px;">💡 提示：死者手里有线索，你见过这个人</span>',
answers: ['店员','咖啡馆店员','那个店员','女店员','咖啡店员','咖啡店店员','服务员'],
correctMsg: '✅ 正确！死者手里攥着的黄色布料，正是店员围裙上的。她就是凶手！',
wrongMsg: '❌ 再想想……死者手里有线索，你见过这个人。'
},
evidence: {
question: '🔍 <span class="clue-highlight">推理题 3/3：关键证据</span><br><br>凶手已经承认了杀人，但你需要指出最关键的物证。<br><br><span class="gray">❓ 最关键的证据是什么？</span><br><span style="color:#888;font-size:14px;">💡 提示：死者手里有东西，凶手身上有痕迹</span>',
answers: ['黄色布料','伤疤','黄色布片','布片','布料','围裙碎片','黄色布','黄布'],
correctMsg: '✅ 正确！黄色布料是死者从凶手身上扯下的，这就是铁证！',
wrongMsg: '❌ 再想想……死者手里紧握着什么？凶手身上少了什么？'
}
};

var puzzleList = ['method','killer','evidence'];
var puzzleIndex = 0;

// ========== 场景数据 ==========
var scenes = [
{
ch:1,nm:'发现尸体',
tx:'你赶到废弃画廊时，警笛声已经远去。<br><br>画家死了。<br><br>他倒在画廊中央，胸口插着一把刀。门从内侧反锁，钥匙在他的口袋里。窗户紧闭，从内侧锁死。<br><br><span class="dr">这是一个完美的密室。</span><br><br><span class="gray">你注意到：</span><br>· 地上有一小滩水渍<br>· 死者右手紧握着一片<span class="clue-highlight">黄色布料</span><br>· 门缝里有一道细小的划痕',
img:'72776.jpeg',cap:'案发现场 · 密室',
op:[
{lb:'🕊️ "他死前在保护什么……"',nx:1,cl:'画家的死有隐情',purity:10,corrupt:-5},
{lb:'🔍 "我要仔细检查现场。"',nx:1,cl:'密室现场',purity:5,corrupt:0},
{lb:'🌑 "凶手一定还在附近。"',nx:1,cl:null,purity:-5,corrupt:10},
]
},
{
ch:1,nm:'调查线索',
tx:'你仔细检查现场。<br><br>你发现：<br>· 门缝上有细小的划痕，像是被线勒过<br>· 地上的水渍已经快干了<br>· 死者手里那片黄色布料，和咖啡馆店员的围裙材质一样<br>· 你想起——她的手腕上有一道旧伤疤<br><br><span class="clue-highlight">线索已收集：</span> 水渍 · 划痕 · 黄色布料 · 伤疤',
img:null,
op:[
{lb:'🔍 "我明白了……这是一个诡计。"',nx:2,cl:'密室手法',purity:5,corrupt:0},
{lb:'🌑 "凶手是那个店员。"',nx:2,cl:'凶手身份',purity:-5,corrupt:10},
]
},
{
ch:1,nm:'推理开始',
tx:'你站在密室中央，看着地上的水渍和门缝上的划痕。<br><br><span class="hl">现在，你需要自己推理出真相。</span><br><br>你只有3次机会。如果推理错误超过3次，你将永远找不到真相。<br><br><span class="gray">点击"继续"开始推理。</span>',
img:null,
op:[],
isPuzzleTrigger:true
},
{
ch:1,nm:'推理中',
tx:'',
img:null,
op:[],
isPuzzleActive:true
},
{
ch:1,nm:'真相揭晓',
tx:'你推理出了真相。<br><br>凶手用<span class="hl">冰线</span>穿过门缝，拉动门闩锁住门。冰融化后变成水，所以现场只有水渍。<br><br>凶手是<span class="hl">咖啡馆店员</span>。死者手里的<span class="hl">黄色布料</span>就是证据。<br><br><span class="gray">画家发现她是组织派来的卧底，所以被灭口了。</span><br><br><span style="color:#f5c842;">🎉 密室杀人案告破！</span>',
img:null,
op:[],
end:true
}
];

// ========== 结局数据 ==========
var endings = [
{ti:'🌅 光明结局',de:'你找出了真相，画家得以安息。你决定继续追查向日葵组织，为所有受害者寻求正义。',em:'🌅'},
{ti:'🌑 黑暗结局',de:'你得知了太多秘密。组织找到了你。第二天，你消失了。警局档案里再也没有你的名字。',em:'🌑'},
{ti:'⚖️ 平衡结局',de:'你选择了沉默。这个案子成为悬案，但你活了下来。有些真相，也许永远不应该被揭开。',em:'⚖️'},
{ti:'💀 死亡结局',de:'你推理错误太多次。当你离开画廊时，一辆黑色轿车跟在你身后。你听到一声枪响。',em:'💀'}
];

// ========== DOM引用 ==========
var sceneEl = document.getElementById('scene');
var msgEl = document.getElementById('msg');
var optEl = document.getElementById('options');
var inputArea = document.getElementById('inputArea');
var answerInput = document.getElementById('answerInput');
var submitBtn = document.getElementById('submitAnswer');
var nextBtn = document.getElementById('nextBtn');
var resetBtn = document.getElementById('resetBtn');
var imgBox = document.getElementById('imgBox');
var imgShow = document.getElementById('imgShow');
var imgCap = document.getElementById('imgCap');
var clueBox = document.getElementById('clueBox');
var clueList = document.getElementById('clueList');

// ========== 核心函数 ==========
function renderScene() {
var s = scenes[currentSceneIdx];
if (!s) return;

document.getElementById('chap').textContent = s.ch || 1;
document.getElementById('sname').textContent = s.nm || '密室';

sceneEl.innerHTML = s.tx || '';

if (s.img) {
imgBox.classList.remove('hidden');
imgShow.src = s.img;
imgCap.textContent = s.cap || '关键物证';
} else {
imgBox.classList.add('hidden');
}

if (collectedClues.length > 0) {
clueBox.classList.remove('hidden');
clueList.textContent = collectedClues.join(' · ');
} else {
clueBox.classList.add('hidden');
}

optEl.innerHTML = '';
inputArea.classList.add('hidden');

// 推理触发点
if (s.isPuzzleTrigger) {
nextBtn.disabled = false;
nextBtn.textContent = '▶ 开始推理';
nextBtn.onclick = startPuzzle;
msgEl.innerHTML = '💡 点击"开始推理"进入推理环节';
return;
}

// 推理激活
if (s.isPuzzleActive) {
showPuzzle();
return;
}

if (s.op && s.op.length > 0) {
s.op.forEach(function(o, i) {
var btn = document.createElement('button');
btn.textContent = o.lb;
btn.onclick = function() { selectOption(i); };
optEl.appendChild(btn);
});
nextBtn.disabled = true;
msgEl.innerHTML = '点击选项推进剧情';
} else if (s.end) {
msgEl.innerHTML = '🎉 <span class="ok">案件告破！</span> 你推理出了真相。';
nextBtn.disabled = false;
nextBtn.textContent = '📖 查看结局';
nextBtn.onclick = showEnding;
} else {
nextBtn.disabled = true;
}

updateStats();
}

// ========== 开始推理 ==========
function startPuzzle() {
puzzleIndex = 0;
puzzleCompleted = {method:false,killer:false,evidence:false};
currentSceneIdx = 3; // 进入推理中场景
renderScene();
}

function showPuzzle() {
if (puzzleIndex >= puzzleList.length) {
// 所有推理完成
currentSceneIdx = 4;
renderScene();
return;
}

var id = puzzleList[puzzleIndex];
var p = puzzles[id];
currentPuzzle = p;

sceneEl.innerHTML = p.question;
inputArea.classList.remove('hidden');
answerInput.value = '';
answerInput.placeholder = '输入你的推理...';
msgEl.innerHTML = '🔍 输入答案（剩余机会：' + (maxWrongAttempts - wrongAttempts) + '次）';
nextBtn.disabled = true;
optEl.innerHTML = '';
updateStats();
}

// ========== 提交推理 ==========
submitBtn.addEventListener('click', function() {
if (gameOver) return;
if (!currentPuzzle) return;

var input = answerInput.value.trim();
if (!input) {
msgEl.innerHTML = '⚠️ 请输入你的推理答案';
return;
}

var isCorrect = false;
currentPuzzle.answers.forEach(function(a) {
if (input.toLowerCase().indexOf(a.toLowerCase()) !== -1) {
isCorrect = true;
}
});

if (isCorrect) {
msgEl.innerHTML = '✅ <span class="ok">' + currentPuzzle.correctMsg + '</span>';
inputArea.classList.add('hidden');
var id = puzzleList[puzzleIndex];
puzzleCompleted[id] = true;
puzzleIndex++;
wrongAttempts = 0;
setTimeout(function() {
showPuzzle();
}, 1200);
} else {
wrongAttempts++;
var remaining = maxWrongAttempts - wrongAttempts;
msgEl.innerHTML = '❌ <span class="fail">' + currentPuzzle.wrongMsg + '</span> 剩余机会：' + remaining;
answerInput.value = '';

if (wrongAttempts >= maxWrongAttempts) {
gameOver = true;
deathCount++;
document.getElementById('deathCount').textContent = deathCount;
showDeath('推理失败 · 组织发现了你', '你推理错误太多次。当你离开画廊时，一辆黑色轿车跟在你身后。你听到一声枪响。');
}
}
});

answerInput.addEventListener('keydown', function(e) {
if (e.key === 'Enter') {
submitBtn.click();
}
});

// ========== 普通选项 ==========
function selectOption(idx) {
var s = scenes[currentSceneIdx];
var o = s.op[idx];
if (!o) return;

var btns = document.querySelectorAll('#options button');
btns.forEach(function(b) { b.disabled = true; });

if (o.cl) {
if (collectedClues.indexOf(o.cl) === -1) {
collectedClues.push(o.cl);
msgEl.innerHTML = '🔍 <span class="ok">获得线索：' + o.cl + '</span>';
}
}

if (o.purity) purity = Math.min(100, Math.max(0, purity + o.purity));
if (o.corrupt) corruption = Math.min(100, Math.max(0, corruption + o.corrupt));

if (o.nx !== undefined) {
currentSceneIdx = o.nx;
setTimeout(function() { renderScene(); }, 500);
}

updateStats();
}

// ========== 死亡结局 ==========
function showDeath(title, desc) {
sceneEl.innerHTML = '<div class="death-screen"><div class="icon">💀</div><div class="title">' + title + '</div><div class="desc">' + desc + '</div><button class="btn-retry" onclick="retryFromCheckpoint()">🔄 从检查点重试</button></div>';
optEl.innerHTML = '';
inputArea.classList.add('hidden');
msgEl.innerHTML = '💀 <span class="fail">你死了。</span>';
nextBtn.disabled = true;
}

function retryFromCheckpoint() {
currentSceneIdx = 2;
puzzleIndex = 0;
wrongAttempts = 0;
gameOver = false;
puzzleCompleted = {method:false,killer:false,evidence:false};
renderScene();
}

// ========== 结局 ==========
function showEnding() {
var balance = purity - corruption;
var endingIdx = 0;
if (balance >= 20) endingIdx = 0;
else if (balance <= -20) endingIdx = 1;
else if (Math.abs(balance) < 10) endingIdx = 2;
else endingIdx = 3;

var e = endings[endingIdx];
sceneEl.innerHTML = '<div class="end-icon">' + e.em + '</div><div class="end-title">' + e.ti + '</div><div class="end-desc">' + e.desc + '</div>';
optEl.innerHTML = '';
inputArea.classList.add('hidden');
msgEl.innerHTML = '🏁 <span class="ok">游戏结束</span>';
nextBtn.disabled = true;
nextBtn.textContent = '🔚 已完结';
gameOver = true;
}

function updateStats() {
document.getElementById('purityVal').textContent = purity;
document.getElementById('corruptVal').textContent = corruption;
document.getElementById('balanceVal').textContent = purity - corruption;
document.getElementById('deathCount').textContent = deathCount;
}

function resetGame() {
purity = 50;
corruption = 50;
deathCount = 0;
currentSceneIdx = 0;
collectedClues = [];
gameOver = false;
wrongAttempts = 0;
puzzleIndex = 0;
puzzleCompleted = {method:false,killer:false,evidence:false};
currentPuzzle = null;
nextBtn.textContent = '继续';
nextBtn.onclick = null;
renderScene();
updateStats();
}

resetBtn.addEventListener('click', resetGame);
renderScene();
updateStats();
</script>
</body>
</html>
