<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏸 火柴人羽毛球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:12px;}
.game-box{background:#1a1a2e;border-radius:20px;padding:16px;border:1px solid #2a2a4a;max-width:480px;width:100%;}
canvas{display:block;width:100%;border-radius:12px;background:#0d0d1a;cursor:pointer;}
.score{display:flex;justify-content:space-between;color:#ddd;font-size:18px;padding:8px 12px;border-bottom:1px solid #2a2a4a;margin-bottom:8px;}
.score span{color:#f5c842;font-weight:bold;}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.controls button{background:#2a2a4a;border:1px solid #3a3a5a;color:#ddd;padding:10px 16px;border-radius:30px;font-size:13px;cursor:pointer;flex:1;min-width:60px;transition:0.2s;}
.controls button:hover{background:#3a3a5a;border-color:#f5c842;}
.controls button:active{transform:scale(0.95);}
.controls .red{background:#4a1a2a;border-color:#6a2a3a;}
.controls .red:hover{background:#5a2a3a;}
.controls .green{background:#1a3a2a;border-color:#2a5a3a;}
.controls .green:hover{background:#2a4a3a;}
.info{text-align:center;color:#888;font-size:12px;margin-top:8px;}
.key-hint{color:#555;font-size:11px;text-align:center;margin-top:4px;}
</style>
</head>
<body>
<div class="game-box">
    <div class="score">
        <span>🧑 你 <span id="p1Score">0</span></span>
        <span id="statusText">🏸 发球</span>
        <span>🤖 电脑 <span id="p2Score">0</span></span>
    </div>
    <canvas id="gameCanvas" width="440" height="280"></canvas>
    <div class="controls">
        <button class="green" id="upBtn">⬆ 上</button>
        <button class="green" id="downBtn">⬇ 下</button>
        <button id="serveBtn">🏸 发球</button>
        <button class="red" id="resetBtn">🔄 重开</button>
    </div>
    <div class="key-hint">⌨️ 键盘: W=上 S=下 | 空格=发球</div>
    <div class="info">先得 11 分获胜</div>
</div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var W = 440, H = 280;

// -------- 游戏对象 --------
var ball = { x: W/2, y: H/2, vx: 2.5, vy: 1.8, speed: 3.2, radius: 5 };
var player1 = { x: 20, y: H/2 - 30, w: 8, h: 50, dy: 0, score: 0 };
var player2 = { x: W - 28, y: H/2 - 30, w: 8, h: 50, dy: 0, score: 0 };
var keys = { w: false, s: false };
var gameState = 'serve'; // serve, playing, scored, gameover
var serveTimer = 0;
var winScore = 11;
var statusText = '按 空格键 发球';

// -------- AI 逻辑 --------
function updateAI() {
    var targetY = ball.y - player2.h/2;
    var diff = targetY - player2.y;
    var speed = 2.2;
    if (gameState === 'playing') {
        if (Math.abs(diff) > 12) {
            player2.dy = Math.sign(diff) * speed;
        } else {
            player2.dy = 0;
        }
    } else {
        player2.dy = 0;
    }
}

// -------- 物理更新 --------
function update() {
    if (gameState === 'playing') {
        // 球移动
        ball.x += ball.vx;
        ball.y += ball.vy;

        // 上下墙反弹
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > H) {
            ball.vy *= -1;
            ball.y = Math.max(ball.radius, Math.min(H - ball.radius, ball.y));
        }

        // 玩家1 碰撞（左）
        if (ball.vx < 0 &&
            ball.x - ball.radius < player1.x + player1.w &&
            ball.x + ball.radius > player1.x &&
            ball.y > player1.y && ball.y < player1.y + player1.h) {
            var hitPos = (ball.y - player1.y) / player1.h;
            ball.vx = Math.abs(ball.vx) * 1.03;
            ball.vy += (hitPos - 0.5) * 3;
            ball.vy = Math.min(Math.max(ball.vy, -5), 5);
            ball.x = player1.x + player1.w + ball.radius;
            ball.speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            if (ball.speed > 6) { ball.vx = ball.vx / ball.speed * 6; ball.vy = ball.vy / ball.speed * 6; }
        }

        // 玩家2 碰撞（右）
        if (ball.vx > 0 &&
            ball.x + ball.radius > player2.x &&
            ball.x - ball.radius < player2.x + player2.w &&
            ball.y > player2.y && ball.y < player2.y + player2.h) {
            var hitPos2 = (ball.y - player2.y) / player2.h;
            ball.vx = -Math.abs(ball.vx) * 1.03;
            ball.vy += (hitPos2 - 0.5) * 3;
            ball.vy = Math.min(Math.max(ball.vy, -5), 5);
            ball.x = player2.x - ball.radius;
            ball.speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            if (ball.speed > 6) { ball.vx = ball.vx / ball.speed * 6; ball.vy = ball.vy / ball.speed * 6; }
        }

        // 出界判定
        if (ball.x < -10) {
            player2.score++;
            if (player2.score >= winScore) { gameState = 'gameover'; statusText = '💻 电脑赢了！'; }
            else { gameState = 'scored'; statusText = '🤖 电脑得分'; }
            ball.x = W/2; ball.y = H/2;
        }
        if (ball.x > W + 10) {
            player1.score++;
            if (player1.score >= winScore) { gameState = 'gameover'; statusText = '🎉 你赢了！'; }
            else { gameState = 'scored'; statusText = '🧑 你得分！'; }
            ball.x = W/2; ball.y = H/2;
        }
    }

    // 玩家移动
    if (keys.w) player1.dy = -3.5;
    else if (keys.s) player1.dy = 3.5;
    else player1.dy *= 0.85;

    player1.y += player1.dy;
    player1.y = Math.max(0, Math.min(H - player1.h, player1.y));

    // AI移动
    updateAI();
    player2.y += player2.dy;
    player2.y = Math.max(0, Math.min(H - player2.h, player2.y));

    // 发球计时
    if (gameState === 'scored') {
        serveTimer++;
        if (serveTimer > 50) {
            gameState = 'serve';
            statusText = '按 空格键 发球';
            serveTimer = 0;
            ball.vx = 0; ball.vy = 0;
        }
    }
}

// -------- 绘制 --------
function draw() {
    ctx.clearRect(0, 0, W, H);
    // 背景网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (var i=0; i<W; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for (var i=0; i<H; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
    // 中线
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
    // 中圈
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath(); ctx.arc(W/2, H/2, 30, 0, Math.PI*2); ctx.stroke();

    // 球
    ctx.shadowColor = '#f5c842';
    ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
    ctx.fillStyle = '#f5c842'; ctx.fill();
    ctx.shadowBlur = 0;

    // 画火柴人（玩家1）
    drawStickman(player1.x + player1.w/2, player1.y + player1.h/2, '#4fc3f7', '🧑');
    // 画火柴人（玩家2）
    drawStickman(player2.x + player2.w/2, player2.y + player2.h/2, '#ff6b6b', '🤖');

    // 显示分数状态
    document.getElementById('p1Score').textContent = player1.score;
    document.getElementById('p2Score').textContent = player2.score;
    document.getElementById('statusText').textContent = statusText;
}

// -------- 画火柴人 --------
function drawStickman(cx, cy, color, label) {
    var s = 12;
    ctx.save();
    ctx.translate(cx, cy);
    // 头
    ctx.shadowBlur = 6;
    ctx.shadowColor = color + '40';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -s*0.6, s*0.35, 0, Math.PI*2); ctx.stroke();
    // 身体
    ctx.beginPath(); ctx.moveTo(0, -s*0.25); ctx.lineTo(0, s*0.35); ctx.stroke();
    // 左臂
    ctx.beginPath(); ctx.moveTo(0, -s*0.05); ctx.lineTo(-s*0.5, s*0.1); ctx.stroke();
    // 右臂（拿球拍）
    ctx.beginPath(); ctx.moveTo(0, -s*0.05); ctx.lineTo(s*0.6, -s*0.1); ctx.stroke();
    // 球拍
    ctx.strokeStyle = '#f5c842';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(s*0.7, -s*0.15, s*0.2, 0, Math.PI*2); ctx.stroke();
    // 左腿
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, s*0.35); ctx.lineTo(-s*0.4, s*0.9); ctx.stroke();
    // 右腿
    ctx.beginPath(); ctx.moveTo(0, s*0.35); ctx.lineTo(s*0.4, s*0.9); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
}

// -------- 发球 --------
function serve() {
    if (gameState === 'serve') {
        var angle = (Math.random() - 0.5) * 0.8;
        var dir = Math.random() > 0.5 ? 1 : -1;
        ball.vx = dir * (2.5 + Math.random() * 1.2);
        ball.vy = (Math.random() - 0.5) * 3;
        ball.x = W/2 + dir * 20;
        ball.y = H/2 + (Math.random() - 0.5) * 40;
        gameState = 'playing';
        statusText = '🏸 对打中...';
    }
}

// -------- 重置 --------
function resetGame() {
    player1.score = 0; player2.score = 0;
    player1.y = H/2 - 25; player2.y = H/2 - 25;
    ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
    gameState = 'serve';
    statusText = '按 空格键 发球';
    document.getElementById('p1Score').textContent = '0';
    document.getElementById('p2Score').textContent = '0';
}

// -------- 键盘控制 --------
document.addEventListener('keydown', function(e) {
    if (e.key === 'w' || e.key === 'W') { keys.w = true; e.preventDefault(); }
    if (e.key === 's' || e.key === 'S') { keys.s = true; e.preventDefault(); }
    if (e.key === ' ') { e.preventDefault(); serve(); }
});
document.addEventListener('keyup', function(e) {
    if (e.key === 'w' || e.key === 'W') { keys.w = false; }
    if (e.key === 's' || e.key === 'S') { keys.s = false; }
});

// -------- 手机触控 --------
var upBtn = document.getElementById('upBtn');
var downBtn = document.getElementById('downBtn');
upBtn.addEventListener('touchstart', function(e) { e.preventDefault(); keys.w = true; });
upBtn.addEventListener('touchend', function(e) { e.preventDefault(); keys.w = false; });
upBtn.addEventListener('mousedown', function() { keys.w = true; });
upBtn.addEventListener('mouseup', function() { keys.w = false; });
downBtn.addEventListener('touchstart', function(e) { e.preventDefault(); keys.s = true; });
downBtn.addEventListener('touchend', function(e) { e.preventDefault(); keys.s = false; });
downBtn.addEventListener('mousedown', function() { keys.s = true; });
downBtn.addEventListener('mouseup', function() { keys.s = false; });

document.getElementById('serveBtn').addEventListener('click', serve);
document.getElementById('resetBtn').addEventListener('click', resetGame);

// -------- 游戏循环 --------
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
