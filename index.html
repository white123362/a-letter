<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0708;color:#ddd;font-family:'STKaiti','华文楷体','KaiTi',serif;overflow:hidden;height:100vh;width:100vw;position:fixed;touch-action:none;}
#app{width:100%;height:100%;position:relative;background:#0d0a12;}
canvas{display:block;width:100%;height:100%;background:#0d0a12;}
.hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;pointer-events:none;z-index:10;flex-wrap:wrap;gap:3px;}
.hud-left{display:flex;align-items:center;gap:5px;background:rgba(10,7,8,0.7);padding:3px 8px;border-radius:10px;backdrop-filter:blur(4px);border:1px solid rgba(60,42,42,0.3);}
.hud-left .avatar{width:26px;height:26px;border-radius:50%;background:#c45a6a;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #c45a6a;}
.hud-left .info{font-size:9px;color:#ddd;line-height:1.2;}
.hud-left .info .name{color:#f5c842;font-weight:bold;font-size:11px;}
.hud-left .info .detail{color:#886a7a;font-size:8px;}
.hud-right{display:flex;align-items:center;gap:4px;background:rgba(10,7,8,0.7);padding:3px 8px;border-radius:10px;backdrop-filter:blur(4px);border:1px solid rgba(60,42,42,0.3);font-size:9px;}
.hud-right .item{display:flex;align-items:center;gap:2px;color:#886a7a;}
.hud-right .item .val{color:#f5c842;font-weight:bold;}
.menu{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:10;flex-wrap:wrap;padding:0 4px;}
.menu button{background:rgba(18,12,14,0.8);border:1px solid #2a1a1a;color:#886a7a;padding:4px 10px;border-radius:12px;font-size:10px;font-family:inherit;cursor:pointer;backdrop-filter:blur(4px);}
.menu button:active{transform:scale(0.95);}
.scene-name{position:absolute;top:48px;left:50%;transform:translateX(-50%);color:#886a7a;font-size:11px;letter-spacing:3px;z-index:10;background:rgba(10,7,8,0.4);padding:2px 12px;border-radius:8px;}
.joystick-area{position:absolute;bottom:70px;left:12px;width:90px;height:90px;z-index:20;touch-action:none;}
.joystick-base{width:90px;height:90px;border-radius:50%;background:rgba(30,20,22,0.5);border:2px solid rgba(60,42,42,0.4);position:relative;}
.joystick-knob{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d46a7a,#8a3a4a);border:2px solid #c45a6a;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
.action-btns{position:absolute;bottom:70px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:20;pointer-events:none;}
.action-btns button{pointer-events:auto;width:50px;height:50px;border-radius:50%;border:2px solid #3a2a2a;font-size:18px;cursor:pointer;background:rgba(20,12,14,0.85);color:#ddd;backdrop-filter:blur(4px);}
.action-btns button:active{transform:scale(0.88);}
</style>
</head>

    notes: [261.63, 293.66, 329.63, 392.00, 440.00],
    melodies: {
        '长安城': { notes: [0,2,4,3,2,0,4,3], tempo: 400 },
        '桃花林': { notes: [2,4,3,2,0,2,4,3], tempo: 350 },
        '雪夜山庄': { notes: [4,3,2,1,0,2,3,4], tempo: 600 },
        '月老庙': { notes: [0,2,3,4,3,2,0,2], tempo: 500 },
        'default': { notes: [0,2,4,2,0,2,4,3], tempo: 450 }
    },
    init: function() {
        try { this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); this.gainNode = this.audioCtx.createGain(); this.gainNode.gain.value = this.volume; this.gainNode.connect(this.audioCtx.destination); return true; } catch(e) { return false; }
    },
    play: function(sceneName) {
        if (!this.audioCtx) { if(!this.init()) return; }
        this.stop();
        var melody = this.melodies[sceneName] || this.melodies['default'];
        this.isPlaying = true;
        var self = this;
        var idx = 0;
        this.interval = setInterval(function() {
            if (!self.isPlaying) return;
            var noteIdx = melody.notes[idx % melody.notes.length];
            var freq = self.notes[noteIdx % self.notes.length];
            var osc = self.audioCtx.createOscillator();
            var gain = self.audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = self.volume;
            gain.gain.exponentialRampToValueAtTime(0.001, self.audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(self.audioCtx.destination);
            osc.start();
            osc.stop(self.audioCtx.currentTime + 0.3);
            idx++;
        }, melody.tempo);
    },
    stop: function() { this.isPlaying = false; if(this.interval){clearInterval(this.interval);this.interval=null;} },
    toggle: function() { if(this.isPlaying){this.stop();}else{var scene=scenes[sceneIndex]||'default';this.play(scene);} }
};

// ---------- 绘制函数 ----------
function drawScene() {
    var light = getLightColor();
    var grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W);
    grad.addColorStop(0, sceneColors[sceneIndex]);
    grad.addColorStop(1, '#0a0708');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 0.5;
    for (var i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for (var i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

    ctx.fillStyle = 'rgba(30,25,20,0.12)';
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    ctx.fillStyle = 'rgba(200,180,180,0.05)';
    ctx.font = '12px "STKaiti","华文楷体",serif';
    ctx.textAlign = 'center';
    ctx.fillText(sceneIcons[sceneIndex] + ' ' + scenes[sceneIndex] + ' · ' + timeSystem.getPeriod() + ' · ' + weatherIcons[currentWeather], W/2, 30);

    if (onlineState && onlineState.isConnected && onlineState.players.length > 1) {
        ctx.fillStyle = 'rgba(79,195,247,0.2)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('🌐 ' + onlineState.players.length + '人', W - 12, 44);
    }
}

function drawPlayer() {
    var x = player.x;
    var y = player.y;

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(x, y + 24, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    var outfit = G.outfits.find(function(o) { return o.id === G.player.outfit; });
    var mainColor = outfit ? outfit.color : '#c45a6a';
    ctx.shadowColor = 'rgba(196,90,106,0.08)';
    ctx.shadowBlur = 15;
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#8a3a4a';
    ctx.fillRect(x - 10, y + 13, 20, 16);

    ctx.fillStyle = '#e8d0c8';
    ctx.beginPath();
    ctx.arc(x, y - 4, 11, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(x - 5, y - 8, 2.5, 2.5);
    ctx.fillRect(x + 2.5, y - 8, 2.5, 2.5);

    ctx.strokeStyle = '#8a4a5a';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(x, y - 1, 2.5, 0.1, Math.PI - 0.1);
    ctx.stroke();

    ctx.fillStyle = 'rgba(245,200,66,0.25)';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(G.player.name, x, y - 22);

    if (G.player.isFlying) {
        ctx.fillStyle = 'rgba(168,168,232,0.06)';
        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(168,168,232,0.2)';
        ctx.fillRect(x - 2, y - 40, 4, 18);
    }

    if (G.player.isRiding) {
        ctx.fillStyle = 'rgba(126,200,163,0.06)';
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.fill();
    }

    if (joystick.active) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.beginPath();
        ctx.arc(x + joystick.dx * 20, y + joystick.dy * 20, 8, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ---------- 更新 ----------
function updatePlayer() {
    var dx = 0, dy = 0, speed = G.player.isFlying ? 5 : (G.player.isRiding ? 4.5 : 3.5);
    if (keys.w) dy = -speed;
    if (keys.s) dy = speed;
    if (keys.a) dx = -speed;
    if (keys.d) dx = speed;

    if (joystick.active) {
        var mag = Math.sqrt(joystick.dx * joystick.dx + joystick.dy * joystick.dy);
        if (mag > 1) mag = 1;
        dx += joystick.dx * speed * mag;
        dy += joystick.dy * speed * mag;
    }

    var total = Math.sqrt(dx * dx + dy * dy);
    if (total > speed) { dx = dx/total*speed; dy = dy/total*speed; }

    player.x += dx;
    player.y += dy;
    if (player.x < 20) player.x = 20;
    if (player.x > W - 20) player.x = W - 20;
    if (player.y < 20) player.y = 20;
    if (player.y > H - 20) player.y = H - 20;
}

// ---------- 游戏循环 ----------
function gameLoop() {
    timeSystem.advance();
    weatherTimer++;
    if (weatherTimer > 300) { weatherTimer = 0; currentWeather = (currentWeather + 1) % weatherTypes.length; }
    updatePlayer();

    drawScene();
    drawPlayer();

    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    var status = '';
    if (G.player.isFlying) status = '🗡️ 御剑飞行';
    else if (G.player.isRiding) status = '🐉 骑乘中';
    else status = '💡 摇杆移动';
    ctx.fillText(status + ' · ' + timeSystem.getTime() + ' · 第' + timeSystem.day + '天', W/2, H - 10);

    requestAnimationFrame(gameLoop);
}

// ---------- 摇杆 ----------
var jArea = document.getElementById('joystickArea');
var jBase = document.getElementById('joystickBase');
var jKnob = document.getElementById('joystickKnob');

jArea.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    var rect = jBase.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var maxD = 35;
    var dx = t.clientX - cx;
    var dy = t.clientY - cy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > maxD) { dx = dx/dist*maxD; dy = dy/dist*maxD; }
    joystick.dx = dx/maxD;
    joystick.dy = dy/maxD;
    joystick.active = true;
    jKnob.style.transform = 'translate(' + (dx - 19) + 'px, ' + (dy - 19) + 'px)';
}, {passive: false});

jArea.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    var rect = jBase.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var maxD = 35;
    var dx = t.clientX - cx;
    var dy = t.clientY - cy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > maxD) { dx = dx/dist*maxD; dy = dy/dist*maxD; }
    joystick.dx = dx/maxD;
    joystick.dy = dy/maxD;
    joystick.active = true;
    jKnob.style.transform = 'translate(' + (dx - 19) + 'px, ' + (dy - 19) + 'px)';
}, {passive: false});

jArea.addEventListener('touchend', function(e) {
    e.preventDefault();
    joystick.dx = 0;
    joystick.dy = 0;
    joystick.active = false;
    jKnob.style.transform = 'translate(-50%,-50%)';
}, {passive: false});

function doLottery() {
    if (G.player.gold < 50) { showStatus('⚠️ 金币不足50'); return; }
    G.player.gold -= 50;
    var rand = Math.random();
    var pool = [];
    var rarityName = '';
    if (rand < 0.05) { pool = lotteryPool.ssr; rarityName = 'SSR'; }
    else if (rand < 0.25) { pool = lotteryPool.sr; rarityName = 'SR'; }
    else if (rand < 0.60) { pool = lotteryPool.r; rarityName = 'R'; }
    else { pool = lotteryPool.n; rarityName = 'N'; }
    
    var prize = pool[Math.floor(Math.random() * pool.length)];
    var msg = '🎉 抽到 ' + rarityName + '：' + prize.name + '（' + prize.type + '）';
    showStatus(msg);
    speechSystem.speak('抽到' + rarityName + prize.name, '女');
    
    // 处理奖品
    if (prize.type === '神兽') {
        if (!G.player.mountData.ownedMounts.includes(prize.name)) {
            G.player.mountData.ownedMounts.push(prize.name);
        }
    } else if (prize.type === '汉服' || prize.type === '汉服') {
        // 检查是否已拥有
        var existing = G.outfits.find(function(o) { return o.name === prize.name; });
        if (existing && !G.player.collectedOutfits) {
            if (!G.player.collectedOutfits) G.player.collectedOutfits = [];
            if (!G.player.collectedOutfits.includes(prize.name)) {
                G.player.collectedOutfits.push(prize.name);
            }
        }
        // 添加金币奖励作为替代
        G.player.gold += 20;
    } else if (prize.type === '灵宠') {
        if (!G.player.mountData.ownedMounts.includes(prize.name)) {
            G.player.mountData.ownedMounts.push(prize.name);
        }
    } else if (prize.type === '金币') {
        var goldAmount = parseInt(prize.name) || 20;
        G.player.gold += goldAmount;
    } else if (prize.type === '灵石') {
        var lingshiAmount = parseInt(prize.name) || 10;
        G.player.lingshi += lingshiAmount;
    } else if (prize.type === '物品') {
        var item = G.player.inventory.find(function(i) { return i.name === prize.name; });
        if (item) { item.count += 1; }
        else { G.player.inventory.push({ id: 'item_' + Date.now(), name: prize.name, desc: '抽奖获得', rarity: prize.rarity, icon: prize.icon, value: 10, count: 1 }); }
    }
    
    // 更新衣冠阁收集
    if (!G.player.collectedOutfits) G.player.collectedOutfits = [];
    if (prize.type === '汉服' && !G.player.collectedOutfits.includes(prize.name)) {
        G.player.collectedOutfits.push(prize.name);
    }
    
    updateHUD();
    closeModal();
    setTimeout(openLottery, 300);
}

function propose(npcId) {
    var npc = G.npcs.find(function(n) { return n.id === npcId; });
    if (!npc) return;
    if (G.player.gold < 500) { showStatus('⚠️ 需要500金币'); return; }
    if ((G.player.npcFavorability[npcId] || 50) < 80) { showStatus('⚠️ 好感度不足80'); return; }
    
    var success = Math.random() < 0.5;
    if (success) {
        G.player.gold -= 500;
        G.player.married = true;
        G.player.spouse = npc.name;
        G.player.spouseId = npcId;
        G.player.attack += 5;
        G.player.defense += 3;
        showStatus('🎉 求婚成功！与 ' + npc.name + ' 结为夫妻！');
        speechSystem.speak('恭喜新婚！', '女');
        unlockAchievement('ach_marry');
    } else {
        showStatus('💔 求婚失败...' + npc.name + ' 还需要考虑');
        speechSystem.speak('求婚失败', '女');
    }
    closeModal();
    setTimeout(openMarriagePanel, 300);
    updateHUD();
}

function divorce() {
    if (G.player.gold < 1000) { showStatus('⚠️ 需要1000金币'); return; }
    if (!G.player.married) { showStatus('⚠️ 尚未结婚'); return; }
    G.player.gold -= 1000;
    G.player.married = false;
    G.player.attack -= 5;
    G.player.defense -= 3;
    showStatus('💔 离婚成功');
    closeModal();
    setTimeout(openMarriagePanel, 300);
    updateHUD();
}

    if (!G.player.married) { showStatus('⚠️ 需要先结婚'); return; }
    if (G.player.children.length >= 3) { showStatus('⚠️ 已有3个孩子'); return; }
    if ((G.player.npcFavorability[G.player.spouseId] || 50) < 90) { showStatus('⚠️ 好感度不足90'); return; }
    if (Math.random() > 0.3) { showStatus('💔 没有成功，再试试吧'); return; }
    
    var genders = ['男', '女'];
    var gender = genders[Math.floor(Math.random() * genders.length)];
    var talents = ['聪明', '勇敢', '善良', '灵秀', '勤奋'];

    var child = { name: name, gender: gender, age: 0, talent: talent, stage: '幼儿' };
    G.player.children.push(child);

    speechSystem.speak('恭喜喜得' + (gender === '男' ? '子' : '女'), '女');
    closeModal();

    updateHUD();
}

        html += '<button onclick="disconnectPeer()" style="margin-top:8px;padding:8px;border:1px solid #6a2a2a;border-radius:8px;background:#1a0a0a;color:#ff6b6b;cursor:pointer;font-family:inherit;width:100%;">🔌 断开</button>';
    } else {
        html += '<button onclick="createRoom()" style="padding:8px;border:1px solid #2a5a6a;border-radius:8px;background:#1a2a3a;color:#4fc3f7;cursor:pointer;font-family:inherit;width:100%;margin-bottom:4px;">🚀 创建房间</button>';
        html += '<div style="display:flex;gap:6px;"><input id="roomInput" placeholder="输入房间号" style="flex:1;padding:6px;border:1px solid #2a1a1a;border-radius:8px;background:#0a0708;color:#ddd;font-size:12px;font-family:inherit;"><button onclick="joinRoom()" style="padding:6px 12px;border:1px solid #5a5a2a;border-radius:8px;background:#1a1a0a;color:#f5c842;cursor:pointer;font-family:inherit;">加入</button></div>';
    }
    html += '</div>';
    showModal('🌐 联机', html, '关闭', false);
}

function createRoom() {
    if (typeof Peer === 'undefined') { showStatus('⚠️ 请先加载PeerJS库'); return; }
    onlineState.peer = new Peer();
    onlineState.peer.on('open', function(id) {
        onlineState.isConnected = true;
        onlineState.isHost = true;
        onlineState.roomId = id;
        onlineState.players.push({ id: id, name: G.player.name, isHost: true });
        showStatus('🌐 房间创建成功：' + id);
        closeModal();
        setTimeout(openOnlinePanel, 300);
    });
    onlineState.peer.on('connection', function(conn) {
        onlineState.connections[conn.peer] = conn;
        onlineState.players.push({ id: conn.peer, name: '玩家', isHost: false });
        showStatus('👤 玩家加入');
    });
    onlineState.peer.on('error', function(err) { showStatus('❌ 创建失败'); });
}

function joinRoom() {
    var input = document.getElementById('roomInput');
    if (!input) return;
    var roomId = input.value.trim();
    if (!roomId) { showStatus('⚠️ 请输入房间号'); return; }
    if (typeof Peer === 'undefined') { showStatus('⚠️ 请先加载PeerJS库'); return; }
    onlineState.peer = new Peer();
    onlineState.peer.on('open', function(id) {
        onlineState.isConnected = true;
        onlineState.isHost = false;
        onlineState.roomId = roomId;
        onlineState.players.push({ id: id, name: G.player.name, isHost: false });
        var conn = onlineState.peer.connect(roomId);
        conn.on('open', function() {
            onlineState.connections[roomId] = conn;
            showStatus('✅ 已加入房间：' + roomId);
            closeModal();
            setTimeout(openOnlinePanel, 300);
        });
        conn.on('data', function(data) { console.log('收到数据:', data); });
    });
    onlineState.peer.on('error', function(err) { showStatus('❌ 加入失败'); });
}

function disconnectPeer() {
    if (onlineState.peer) { onlineState.peer.destroy(); }
    onlineState.isConnected = false;
    onlineState.isHost = false;
    onlineState.roomId = null;
    onlineState.connections = {};
    onlineState.players = [];
    showStatus('🔌 已断开');
    closeModal();
}

    box.appendChild(btn);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
}

canvas.addEventListener('click', function(e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W;
    var y = (e.clientY - rect.top) / rect.height * H;
    player.x = Math.max(20, Math.min(W - 20, x));
    player.y = Math.max(20, Math.min(H - 20, y));
});

canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
        var t = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        var x = (t.clientX - rect.left) / rect.width * W;
        var y = (t.clientY - rect.top) / rect.height * H;
        player.x = Math.max(20, Math.min(W - 20, x));
        player.y = Math.max(20, Math.min(H - 20, y));
    }
}, {passive: true});

// ---------- 防黑屏 ----------
setTimeout(function() {
    var ctx2 = canvas.getContext('2d');
    if (ctx2) {
        var w = canvas.width || 400;
        var h = canvas.height || 600;
        ctx2.fillStyle = '#0d0a12';
        ctx2.fillRect(0, 0, w, h);
        ctx2.fillStyle = '#c45a6a';
        ctx2.font = '24px "STKaiti","华文楷体",serif';
        ctx2.textAlign = 'center';
        ctx2.fillText('故人不归', w/2, h/2 - 20);
        ctx2.fillStyle = '#886a7a';
        ctx2.font = '16px "STKaiti","华文楷体",serif';
        ctx2.fillText('加载完成', w/2, h/2 + 30);
    }
}, 100);

console.log('✅ 游戏已启动！');
console.log('📖 欢迎来到《故人不归》古风沉浸式开放世界');
</script>
